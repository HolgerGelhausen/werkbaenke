/* Werkbank-Markdown · Gestaltung des Prototyps. Farben, Schrift und Maße aus der Übergabe „Werkbankdesign 3“. */
:root {
  --ink: #010101; --text: #1c1f25; --muted: #545a66; --line: #dde0e6; --line2: #c3c8d0; --line3: #9aa0ab;
  --panel: #f6f7f9; --chip: #eef0f3; --paper: #ffffff; --red: #e01010; --red2: #c8100f; --focus: #ff1a1a;
  --ok: #137343; --okt: #e9f6ee; --warn: #9a4b00; --warnt: #fff5e8; --warni: #7a3b00;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--text); font: 14px/1.5 Montserrat, "Segoe UI", Arial, sans-serif; }
body.drag-on { cursor: grabbing; user-select: none; -webkit-user-select: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, p { margin: 0; }
a { color: inherit; }
code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--chip); padding: 1px 5px; border-radius: 5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.muted { color: var(--muted); }
.kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* Kopfzeile */
.top { position: sticky; top: 0; z-index: 20; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px; background: var(--paper); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; color: var(--ink); min-width: 0; }
.brand img { height: 26px; width: auto; display: block; }
.brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top nav a { font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 12px 0; }
.top nav a:hover { color: var(--ink); }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 9px 18px; border-radius: 8px; border: 1.5px solid transparent; font: 700 14px/1.2 inherit; font-family: inherit; text-decoration: none; cursor: pointer; }
.btn.red { background: var(--red); color: #fff; } .btn.red:hover { background: var(--red2); }
.btn.black { background: var(--ink); color: #fff; }
.btn.line { background: var(--paper); color: var(--ink); border-color: var(--ink); font-weight: 600; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); text-decoration: underline; cursor: pointer; }
.link:hover { color: var(--ink); }

/* Seiten */
.page { margin: 0 auto; padding: 20px 24px 40px; }
.start { max-width: 860px; }
.ex { max-width: 1040px; }
.start h1 { font-size: clamp(21px, 2.6vw, 25px); font-weight: 800; color: var(--ink); line-height: 1.25; margin: 4px 0 10px; }
.intro p { font-size: 15px; margin-bottom: 10px; }
.intro ul { margin: 0 0 10px; padding-left: 20px; }
.tblwrap { overflow-x: auto; margin: 14px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 7px 12px 7px 0; border-bottom: 1px solid var(--line); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.cta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin: 18px 0 26px; }
.rows { border-top: 1px solid var(--line); margin-top: 6px; }
.row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 6px; border-bottom: 1px solid var(--line); text-decoration: none; }
.row:hover { background: var(--panel); }
.num { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line3); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink); }
.num.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.rt b { display: block; color: var(--ink); } .rt small { display: block; font-size: 13px; color: var(--muted); }
.tag { font-size: 12px; font-weight: 600; background: var(--chip); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.state { font-size: 13px; color: var(--muted); min-width: 64px; text-align: right; }
.num.ok ~ .state { color: var(--ok); font-weight: 700; }
.resetline { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; font-size: 13px; }

/* Übung */
.crumb { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
.crumb a { font-weight: 600; text-decoration: none; } .crumb a:hover { color: var(--ink); }
.segs { display: flex; gap: 4px; margin: 8px 0 14px; }
.segs i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.segs i.ok { background: var(--ok); } .segs i.now { background: var(--focus); }
.ex h1 { font-size: clamp(18px, 2.2vw, 21px); font-weight: 800; color: var(--ink); line-height: 1.25; margin-bottom: 16px; }
.cols { display: grid; gap: 20px 32px; }
@media (min-width: 800px) { .cols { grid-template-columns: 300px minmax(0, 1fr); } }
@media (min-width: 1000px) { .cols { grid-template-columns: 340px minmax(0, 1fr); } }
.case { font-size: 15px; color: var(--ink); margin-bottom: 10px; }
.goal { background: var(--panel); border-radius: 9px; padding: 10px 14px; margin: 4px 0 14px; }
.goal p + p { font-weight: 600; }
.kicker.mat { margin: 14px 0 4px; }
.fold { border-top: 1px solid var(--line); }
.fold:last-of-type { border-bottom: 1px solid var(--line); }
.fold summary { cursor: pointer; padding: 9px 0; font-weight: 700; color: var(--ink); }
.lines { padding-bottom: 10px; }
.lines p { font-size: 13px; border-left: 2px solid var(--line); padding-left: 12px; margin-bottom: 7px; }
.fold.src { margin-top: 14px; }
.fold.src summary { font-weight: 600; color: var(--muted); font-size: 13px; }
.fold.src pre { margin: 0 0 12px; padding: 10px 12px; background: var(--panel); border-radius: 9px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
.formtag { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.formtag b { color: var(--ink); background: var(--chip); border-radius: 999px; padding: 2px 10px; margin-left: 4px; font-weight: 600; }
.q { font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1.35; }
.how { color: var(--muted); margin: 4px 0 12px; }
.fb { border-radius: 9px; padding: 10px 14px; margin-top: 14px; background: var(--panel); }
.fb.warn { background: var(--warnt); color: var(--warni); border: 1.5px solid var(--warn); }
.fb.ok { background: var(--okt); color: var(--ok); border: 1.5px solid var(--ok); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.foot { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.foot a { font-weight: 600; text-decoration: none; } .foot a:hover { color: var(--ink); }
.foot span:last-child { text-align: right; }

/* Karten */
.card { display: inline-flex; align-items: center; text-align: left; min-height: 36px; padding: 6px 12px; border: 2px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--ink); font: 600 14px/1.35 inherit; font-family: inherit; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.card:hover { border-color: var(--line3); }
.card.sel { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(1, 1, 1, .15); }
.card.ok { border-color: var(--ok); background: var(--okt); }
.card.bad { border-color: var(--warn); background: var(--warnt); }
.card.dragging { opacity: .35; }
.ghost { position: fixed; left: 0; top: 0; z-index: 100; margin: 0; pointer-events: none; box-shadow: 0 10px 28px rgba(1, 1, 1, .22); border-color: var(--ink) !important; background: var(--paper); opacity: .96; list-style: none; }
.why { display: block; font-size: 12px; line-height: 1.4; color: var(--warni); margin: 3px 2px 2px; font-weight: 500; }

/* Vorrat */
.pool, .stack { background: var(--panel); border-radius: 9px; padding: 10px 12px 12px; margin-bottom: 12px; border: 2px solid transparent; }
.pool.over, .stack.over { border-color: var(--ink); }
.pk { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; align-items: center; }
.stack { text-align: center; padding-bottom: 16px; }
.card.big { font-size: 16px; padding: 14px 18px; min-height: 64px; max-width: 420px; justify-content: center; text-align: center; box-shadow: 0 0 0 3px rgba(1, 1, 1, .15), 4px 4px 0 var(--line2), 8px 8px 0 var(--line); }

/* Felder */
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.fields.two { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.tgt { border: 2px dashed var(--line2); border-radius: 9px; padding: 8px 10px 10px; min-height: 64px; cursor: pointer; background: var(--paper); }
.armed .tgt, body.drag-on .tgt { border-color: var(--ink); }
.tgt.over { background: var(--panel); border-style: solid; border-color: var(--ink); }
.tl { display: block; margin-bottom: 6px; }
.tl b { display: block; color: var(--ink); } .tl small { display: block; font-size: 12px; color: var(--muted); }
.tc { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.ph { color: var(--line3); font-size: 13px; }

/* Matrix */
.matrix { display: grid; grid-template-columns: 26px repeat(var(--cols), minmax(0, 1fr)); gap: 8px; }
.mxc { text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mxr { display: grid; place-items: center; }
.mxr span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
.matrix .tgt { min-height: 104px; }

/* Plätze */
.slots, .legend { display: grid; gap: 8px; }
.slotrow { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 12px; align-items: center; }
.sl b { display: block; color: var(--ink); } .sl small { display: block; font-size: 12px; color: var(--muted); }
.tgt.slot { min-height: 50px; padding: 5px 8px; display: flex; align-items: center; }
.slotrow.numbered { grid-template-columns: 26px minmax(0, 1fr); gap: 8px; }
.pinnum { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
@media (min-width: 620px) { .legend { grid-template-columns: 1fr 1fr; } }

/* Bild */
.pic { margin: 0 0 12px; }
.picbox { position: relative; max-width: 560px; }
.picbox img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.pin { box-shadow: 0 0 0 3px var(--paper); position: absolute; transform: translate(-50%, -50%); width: 32px; height: 32px; border-radius: 50%; border: 2px dashed var(--ink); background: var(--paper); color: var(--ink); font: 700 13px/1 inherit; font-family: inherit; cursor: pointer; padding: 0; }
.pin::after { content: ""; position: absolute; inset: -8px; }
.pin.has { border-style: solid; background: var(--ink); color: #fff; }
.pin.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.pin.bad { background: var(--warn); border-color: var(--warn); color: #fff; }
.pin.over { box-shadow: 0 0 0 5px rgba(1, 1, 1, .2); border-style: solid; }

/* Lückentext */
.cloze { font-size: 16px; line-height: 2.7; color: var(--ink); }
.gap { display: inline-flex; vertical-align: middle; min-width: 96px; min-height: 40px; padding: 1px; border-radius: 9px; line-height: 1.35; }
.gap .ph { flex: 1; }
.gap.has { border-color: transparent; padding: 0; min-height: 0; min-width: 0; }
.armed .gap.has, body.drag-on .gap.has { border-color: transparent; }
.card.inl { min-height: 36px; }

/* Reihenfolge */
.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.orow { display: grid; grid-template-columns: auto 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 6px 6px 8px; border: 2px solid var(--line); border-radius: 9px; background: var(--paper); cursor: grab; position: relative; }
.orow.ok { border-color: var(--ok); background: var(--okt); }
.orow.bad { border-color: var(--warn); background: var(--warnt); }
.orow.dragging { opacity: .35; }
.orow.ins-before::before, .orow.ins-after::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px; background: var(--ink); }
.orow.ins-before::before { top: -7px; } .orow.ins-after::after { bottom: -7px; }
.grip { color: var(--line3); font-size: 16px; line-height: 1; padding: 10px 2px; touch-action: none; cursor: grab; }
.onum { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.ot { font-weight: 600; color: var(--ink); }
.mvs { display: flex; gap: 4px; }
.mv { width: 44px; height: 44px; border-radius: 8px; border: 1.5px solid var(--line2); background: var(--paper); color: var(--ink); font: 700 16px/1 inherit; font-family: inherit; cursor: pointer; }
.mv:hover:not(:disabled) { border-color: var(--ink); }
.mv:disabled { color: var(--line2); border-color: var(--line); cursor: default; }
.ah { display: none; }
.axis { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.axis.vorn { margin-bottom: 6px; } .axis.vorn::after { content: " ↓"; }
.axis.hinten { margin-top: 6px; } .axis.hinten span:first-child, .axis.hinten i { display: none; }

/* Zeitstrahl: ab 700 px nebeneinander */
@media (min-width: 700px) {
  .f-strahl .order { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: stretch; }
  .f-strahl .orow { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; justify-items: center; text-align: center; padding: 8px 8px 10px; gap: 6px; }
  .f-strahl .grip { display: none; }
  .f-strahl .ot { font-size: 13px; align-self: start; }
  .f-strahl .mv { width: 40px; height: 36px; }
  .f-strahl .av { display: none; } .f-strahl .ah { display: inline; }
  .f-strahl .orow.ins-before::before, .f-strahl .orow.ins-after::after { left: auto; right: auto; top: 0; bottom: 0; width: 3px; height: auto; }
  .f-strahl .orow.ins-before::before { left: -7px; } .f-strahl .orow.ins-after::after { right: -7px; }
  .f-strahl .axis.vorn { display: none; }
  .f-strahl .axis.hinten { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 10px; }
  .f-strahl .axis.hinten span:first-child, .f-strahl .axis.hinten i { display: block; }
  .f-strahl .axis i { height: 2px; background: var(--ink); position: relative; }
  .f-strahl .axis i::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left-color: var(--ink); border-right: 0; }
}

/* Dialog */
dialog { border: 0; border-radius: 12px; padding: 20px 22px; max-width: 420px; box-shadow: 0 24px 60px rgba(1, 1, 1, .25); font: inherit; color: var(--text); }
dialog::backdrop { background: rgba(1, 1, 1, .35); }
dialog h2 { font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 8px; }

/* Schmal */
@media (max-width: 620px) {
  .top { padding: 0 16px; }
  .page { padding: 16px 16px 32px; }
  .row { grid-template-columns: 26px minmax(0, 1fr) auto; }
  .row .tag { grid-column: 2; justify-self: start; }
  .row .state { grid-row: 1; grid-column: 3; min-width: 0; }
  .slotrow { grid-template-columns: 1fr; gap: 4px; }
  .slotrow.numbered { grid-template-columns: 26px minmax(0, 1fr); }
  .card { min-height: 44px; }
  .link { padding: 12px 0; }
  .pin { width: 36px; height: 36px; }
  .foot { grid-template-columns: 1fr 1fr; }
  .foot .link { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
  .matrix { gap: 6px; }
}

/* ===== Weitere Formen (zweite Probeseite) ===== */
.card { gap: 8px; }
.card.add { cursor: pointer; touch-action: auto; }
.wt { flex: none; font-size: 12px; font-weight: 700; background: var(--chip); border-radius: 999px; padding: 1px 8px; color: var(--muted); }

/* Venn: zwei überlappende Flächen, die Mitte gehört zu beiden */
.venn { position: relative; display: grid; grid-template-columns: 36fr 28fr 36fr; min-height: 260px; }
.venn::before, .venn::after { content: ""; position: absolute; top: 0; bottom: 0; width: 64%; border: 2px solid var(--ink); border-radius: 130px; pointer-events: none; }
.venn::before { left: 0; background: rgba(1, 1, 1, .04); }
.venn::after { right: 0; border-color: var(--red); background: rgba(224, 16, 16, .05); }
.venn .tgt { position: relative; z-index: 1; border: 0; border-radius: 0; background: transparent; padding: 20px 10px 18px; }
.venn .v0 { padding-left: 28px; } .venn .v2 { padding-right: 28px; }
.venn .tgt.over { background: rgba(1, 1, 1, .06); }
.venn .tl { text-align: center; margin-bottom: 10px; }
.venn .card { font-size: 13px; }

/* Stifte und Etiketten */
.pens { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.pen { display: inline-flex; align-items: center; gap: 8px; text-align: left; min-height: 40px; padding: 6px 12px; border: 2px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--ink); font: 600 14px/1.3 inherit; font-family: inherit; cursor: pointer; }
.pen small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.pen.on { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(1, 1, 1, .15); }
.tip { width: 18px; height: 18px; border-radius: 4px; flex: none; }
.pen.p0 .tip { background: var(--ink); }
.pen.p1 .tip { background: #ffe1e1; border-bottom: 3px solid var(--red); }
.pen.p2 .tip { background: var(--line2); border-bottom: 3px solid var(--muted); }
.pen.p3 .tip { background: repeating-linear-gradient(135deg, #ffc9c9 0 3px, #fff 3px 6px); border-bottom: 3px solid var(--red); }
.pen.p4 .tip { background: #fff; box-shadow: inset 0 0 0 2px var(--ink); }
.pen.p5 .tip { background: repeating-linear-gradient(135deg, var(--line3) 0 3px, #fff 3px 6px); border-bottom: 3px solid var(--muted); }
.pen.etk { border-radius: 999px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }

/* Markieren im Text */
.mtext { font-size: 16px; line-height: 2.2; color: var(--ink); }
.span { font: inherit; color: inherit; background: none; border: 0; border-bottom: 2px dotted var(--line3); padding: 1px 4px; margin: 0 1px; border-radius: 4px 4px 0 0; cursor: pointer; }
.span:hover { background: var(--chip); }
.span.m.p0 { background: var(--ink); color: #fff; border-bottom: 2px solid var(--ink); border-radius: 4px; }
.span.m.p1 { background: #ffe1e1; border-bottom: 2px solid var(--red); }
.span.m.p2 { background: var(--line); border-bottom: 2px solid var(--muted); }
.span.m.p3 { background: repeating-linear-gradient(135deg, #ffe1e1 0 4px, #fff 4px 8px); border-bottom: 2px solid var(--red); }
.span.m.p4 { background: #fff; border-bottom: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--ink); border-radius: 4px; }
.span.m.p5 { background: repeating-linear-gradient(135deg, var(--line) 0 4px, #fff 4px 8px); border-bottom: 2px solid var(--muted); }
.span.ok { outline: 2px solid var(--ok); outline-offset: 2px; }
.span.bad { outline: 2px dashed var(--warn); outline-offset: 2px; }

/* Verbinden */
.linien { position: relative; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); column-gap: 72px; align-items: start; }
.lcol, .rcol { display: grid; gap: 10px; }
.linien.gleich { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.linien.lbreit { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.linien.lsatz .lnode.l b { font-weight: 500; }
.lsvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
.lsvg .vis { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; }
.lsvg .vis.ok { stroke: var(--ok); }
.lsvg .vis.bad { stroke: var(--warn); stroke-dasharray: 6 5; }
.lsvg .vis.tmp { stroke: var(--muted); stroke-dasharray: 4 4; }
.lsvg .hit { stroke: transparent; stroke-width: 18; pointer-events: stroke; cursor: pointer; }
.lnode { position: relative; display: flex; align-items: center; text-align: left; min-height: 48px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--ink); font: 600 14px/1.35 inherit; font-family: inherit; cursor: pointer; }
.lnode small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.lnode .dot { position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line3); }
.lnode.l .dot { right: -8px; } .lnode.r .dot { left: -8px; }
.lnode.has .dot { background: var(--ink); border-color: var(--ink); }
.lnode.sel, .lnode.over { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(1, 1, 1, .15); }
.lnode.ok { border-color: var(--ok); background: var(--okt); }
.lnode.bad { border-color: var(--warn); background: var(--warnt); }

/* Budget */
.budgetbox { min-height: 130px; }
.meter { display: block; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 2px 0 4px; }
.meter i { display: block; height: 100%; background: var(--ink); transition: width .2s; }
.meter.voll i { background: var(--warn); }
.mtxt { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.meter.voll + .mtxt { color: var(--warni); font-weight: 700; }

/* Etiketten auf Zeilen */
.titems { display: grid; gap: 8px; }
.titem { border: 2px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--paper); cursor: pointer; }
.titem:hover { border-color: var(--line3); }
.titem.over { border-color: var(--ink); background: var(--panel); }
.titem.ok { border-color: var(--ok); background: var(--okt); }
.titem.bad { border-color: var(--warn); background: var(--warnt); }
.tt { display: block; font-weight: 600; color: var(--ink); }
.tls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 30px; margin-top: 6px; }
.chip { min-height: 30px; padding: 4px 10px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--ink); color: #fff; font: 600 12px/1.3 inherit; font-family: inherit; cursor: pointer; }
.chip.ok { background: var(--ok); border-color: var(--ok); }
.chip.bad { background: var(--paper); color: var(--warni); border: 1.5px dashed var(--warn); }

/* Gliederung */
.levels { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 4px 10px 4px 4px; border: 2px solid var(--line); border-radius: 9px; background: var(--paper); cursor: ew-resize; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.lrow .mv { width: 40px; height: 40px; }
.lt { display: flex; align-items: center; min-height: 36px; padding-left: calc(var(--lv) * 28px); font-weight: 600; color: var(--ink);
  background: repeating-linear-gradient(to right, var(--line2) 0 2px, transparent 2px 28px) left center / calc(var(--lv) * 28px) 100% no-repeat; }
.lbar { display: none; }
.lrow.schieben { border-color: var(--ink); }
.lrow.ok { border-color: var(--ok); background: var(--okt); }
.lrow.bad { border-color: var(--warn); background: var(--warnt); }

/* Regler */
.ranges { display: grid; gap: 10px; }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: baseline; padding: 8px 12px 10px; border: 2px solid var(--line); border-radius: 9px; }
.rrow label { font-weight: 600; color: var(--ink); }
.rrow output { font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.rrow input[type=range], .rscale, .rrow small { grid-column: 1 / -1; }
.rrow input[type=range] { width: 100%; height: 34px; margin: 0; accent-color: var(--ink); cursor: pointer; }
.rscale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.okwhy { display: block; font-size: 12px; color: var(--ok); margin-top: 4px; }
.rrow.ok { border-color: var(--ok); background: var(--okt); }
.rrow.bad { border-color: var(--warn); background: var(--warnt); }

/* Kette */
.pk.kk { margin: 4px 0 8px; }
.chainph { border: 2px dashed var(--line2); border-radius: 9px; padding: 14px 12px; color: var(--muted); }
.chainph + .order { display: none; }

@media (max-width: 620px) {
  .venn { grid-template-columns: 1fr; gap: 8px; min-height: 0; }
  .venn::before, .venn::after { display: none; }
  .venn .tgt { border: 2px dashed var(--line2); border-radius: 9px; background: var(--paper); padding: 8px 10px 10px; }
  .venn .v0 { border-left: 5px solid var(--ink); } .venn .v2 { border-left: 5px solid var(--red); }
  .venn .v1 { border-left: 5px solid var(--ink); border-right: 5px solid var(--red); }
  .venn .tl { text-align: left; }
  .linien { column-gap: 40px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .lnode { font-size: 13px; padding: 8px 10px; }
}

/* ===== Formen der dritten Probeseite ===== */
.pn { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.pn.hell { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); }
.ltr { display: inline-grid; place-items: center; width: 20px; height: 20px; border: 1.5px solid var(--line3); border-radius: 50%; font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 2px; }
.setlist { display: grid; gap: 6px; margin-top: 8px; }
.setrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 4px 4px 8px; border: 2px solid var(--line); border-radius: 9px; }
.setrow.ok { border-color: var(--ok); background: var(--okt); }
.setrow.bad { border-color: var(--warn); background: var(--warnt); }
.setrow .mv { width: 40px; height: 40px; }
.sx { font-weight: 600; color: var(--ink); }
.sv { font-weight: 800; margin-left: 6px; font-variant-numeric: tabular-nums; }

/* Punkt im Bild */
.canvas { cursor: crosshair; }
.canvas:focus-visible { outline-offset: 4px; }
.pmark { position: absolute; transform: translate(-50%, -50%); width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid #fff; background: var(--ink); color: #fff; font: 700 13px/1 inherit; font-family: inherit; box-shadow: 0 0 0 2px var(--ink); cursor: grab; touch-action: none; }
.pmark::after { content: ""; position: absolute; inset: -8px; }
.pmark.sel { box-shadow: 0 0 0 2px var(--ink), 0 0 0 7px rgba(1, 1, 1, .2); }
.pmark.ok { background: var(--ok); box-shadow: 0 0 0 2px var(--ok); }
.pmark.bad { background: var(--warn); box-shadow: 0 0 0 2px var(--warn); }
.pmark.dragging { opacity: .35; }

/* Zahlenstrahl */
.zswrap { padding: 0 18px; margin-bottom: 4px; }
.zs { position: relative; height: 132px; cursor: crosshair; border-radius: 9px; }
.zs.over { background: var(--panel); }
.ztrack { position: absolute; left: 0; right: 0; top: 92px; height: 4px; border-radius: 2px; background: var(--ink); }
.ztick { position: absolute; top: 92px; transform: translateX(-50%); padding-top: 14px; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.ztick i { position: absolute; left: 50%; top: -4px; width: 2px; height: 12px; margin-left: -1px; background: var(--ink); }
.zmark { position: absolute; transform: translateX(-50%); width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font: 700 13px/1 inherit; font-family: inherit; cursor: grab; touch-action: none; z-index: 1; }
.zmark::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; margin-left: -1px; background: inherit; }
.zmark.r0 { top: 56px; } .zmark.r0::after { height: 8px; }
.zmark.r1 { top: 26px; } .zmark.r1::after { height: 38px; }
.zmark.r2 { top: -4px; } .zmark.r2::after { height: 68px; }
.zmark.sel { box-shadow: 0 0 0 5px rgba(1, 1, 1, .2); }
.zmark.ok { background: var(--ok); } .zmark.bad { background: var(--warn); }
.zmark.dragging { opacity: .35; }

/* Tabelle */
.tabelle { display: grid; grid-template-columns: minmax(84px, .7fr) repeat(var(--cols), minmax(0, 1fr)); gap: 8px; align-items: stretch; }
.tbc { align-self: end; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tbr { align-self: center; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.tabelle .tgt.slot { min-height: 58px; }
.tabelle .card { font-size: 13px; }

/* Lücken mit Gruppen */
.chips.grp { margin-bottom: 10px; }
.chips.grp:last-child { margin-bottom: 0; }
.gap .ph { align-self: center; padding: 0 8px; font-size: 12px; color: var(--muted); }

/* Bildfolge */
.pin.frei { border-style: solid; }

/* Gliederung mit Reihenfolge */
.lrow { position: relative; }
.lrow.dragging { opacity: .35; }
.lrow.ins-before::before, .lrow.ins-after::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px; background: var(--ink); }
.lrow.ins-before::before { top: -6px; } .lrow.ins-after::after { bottom: -6px; }
.levels.sort .mvs { align-items: center; }
.levels.sort .mv { width: 36px; height: 36px; }

@media (max-width: 620px) {
  .tabelle { grid-template-columns: minmax(70px, .6fr) repeat(var(--cols), minmax(0, 1fr)); gap: 6px; }
  .tabelle .card { font-size: 12px; padding: 5px 7px; }
  .levels.sort .mv { width: 34px; height: 40px; }
  .levels.sort .mvs { gap: 2px; }
  .levels.sort .lt { font-size: 13px; }
}

/* ===== Werkbank: Lernwege, Trainer, Anleitung, Abschluss, Hilfe ===== */
.top nav { display: flex; align-items: center; gap: 16px; }
.top nav a[aria-current="page"] { color: var(--ink); font-weight: 700; }
.modus { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; }
.modus a { padding: 5px 10px !important; font-size: 12px; font-weight: 700; color: var(--ink) !important; }
.modus a.an { background: var(--ink); color: #fff !important; }
.row.weg { grid-template-columns: minmax(0, 1fr) auto; }
.row.ohneform { grid-template-columns: 26px minmax(0, 1fr) auto; }
.kz { font-weight: 500; color: var(--muted); font-size: 13px; }
.state.okz { color: var(--ok); font-weight: 700; }
.num.jetzt { background: var(--ink); border-color: var(--ink); color: #fff; }
.solaeuft { margin: 18px 0 10px; font-size: 14px; }
.fold.mehr summary { font-weight: 600; color: var(--muted); }
.fold.mehr ul, .fold.leit ul { margin: 0 0 10px; padding-left: 20px; }
.fertigzeile { color: var(--ok); font-weight: 700; }
.kicker.oben { margin-top: 14px; } .kicker.danach { margin-top: 22px; }
.skills { margin: 6px 0 0; padding-left: 20px; }
.start .crumb a { font-weight: 600; text-decoration: none; }
.schritt { color: var(--text); margin: 6px 0 0; }
.schritt + .how { margin-top: 2px; }
.nach { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.nach + .foot { margin-top: 10px; }
.nach .link { color: var(--ink); }
.tippbox { background: var(--panel); border-radius: 9px; padding: 9px 14px; margin-top: 8px; }
.fold.warum summary { font-weight: 600; color: var(--muted); font-size: 13px; }
.lines p.roh { white-space: pre-wrap; }
.tblwrap.mtab { margin: 8px 0 0; }

/* Auswahl, Vergleich, Freitext */
.opts { display: grid; gap: 10px; }
.opt, .draft { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; padding: 9px 12px; border: 2px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--text); font: inherit; cursor: pointer; }
.opt:hover, .draft:hover { border-color: var(--line3); }
.opt.an, .draft.an { border-color: var(--ink); }
.opt.ok, .draft.ok { border-color: var(--ok); background: var(--okt); }
.opt.bad, .draft.bad { border-color: var(--warn); background: var(--warnt); }
.opt b { display: block; font-size: 15px; color: var(--ink); }
.otx { display: block; }
.radio, .box { flex: none; width: 22px; height: 22px; margin-top: 1px; border: 2px solid var(--line3); background: var(--paper); display: grid; place-items: center; }
.radio { border-radius: 50%; } .box { border-radius: 5px; }
.an > .radio, .an .dk > .radio { border-color: var(--ink); }
.an > .radio::after, .an .dk > .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.an > .box { background: var(--ink); border-color: var(--ink); }
.an > .box::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 700; line-height: 1; }
.teil { font-weight: 700; color: var(--ink); margin: 14px 0 8px; }
.teil:first-child { margin-top: 0; }
.teil.klein { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 10px 0 6px; }
.drafts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.draft { flex-direction: column; gap: 8px; }
.draft img { display: block; max-width: 100%; height: auto; border-radius: 6px; }
.dk { display: flex; align-items: center; gap: 8px; }
.dk b { color: var(--ink); }
.dtx { display: block; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.formhilfe { background: var(--panel); border-radius: 9px; padding: 9px 14px; margin-bottom: 8px; font-size: 13px; }
.fold.leit { margin-bottom: 10px; } .fold.leit summary { font-weight: 600; font-size: 13px; }
.feldname { display: block; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
textarea { display: block; width: 100%; padding: 10px 12px; border: 2px solid var(--line3); border-radius: 9px; font: 14px/1.5 inherit; font-family: inherit; color: var(--text); resize: vertical; }
.zaehler { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.zbalken { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.zbalken i { display: block; height: 100%; background: var(--ink); transition: width .2s; }
.pflicht { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { font-size: 12px; font-weight: 600; background: var(--chip); border-radius: 999px; padding: 3px 10px; }
.pchip.ok { background: var(--okt); color: var(--ok); }

/* Abschluss */
.fertig .haken { width: 56px; height: 56px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 700; margin: 8px 0 12px; }
.kicker.gruen { color: var(--ok); }
.fertig h1:focus { outline: none; }
.eingaben { margin: 6px 0 18px; padding-left: 22px; }
.eingaben > li { padding: 6px 0; border-bottom: 1px solid var(--line); }
.eingaben b { display: block; color: var(--ink); }
.eingaben ul { margin: 2px 0 0; padding-left: 18px; font-size: 13px; }
.eine { display: block; font-size: 13px; white-space: pre-wrap; }
.fhin { font-size: 13px; color: var(--muted); margin-top: 10px; }
.btns.klein { margin-top: 16px; } .btns.klein .btn { min-height: 34px; padding: 6px 12px; font-size: 13px; }

/* Hilfe */
.hilfe h1 { margin-bottom: 12px; }
.pillen { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.pille { padding: 6px 14px; border-radius: 999px; background: var(--chip); color: var(--ink); font-weight: 600; text-decoration: none; }
.pille.an { background: var(--ink); color: #fff; }
.hh { font-size: 14px; font-weight: 700; color: var(--ink); margin: 14px 0 2px; }
.begriffe { margin: 0; display: grid; gap: 10px 28px; }
@media (min-width: 700px) { .begriffe:not(.eins) { grid-template-columns: 1fr 1fr; } }
.begriffe dt { font-weight: 700; color: var(--ink); } .begriffe dd { margin: 0; font-size: 13px; }
.quellen { list-style: none; margin: 10px 0 0; padding: 0; }
.quellen li { padding: 9px 0; border-bottom: 1px solid var(--line); }
.quellen a, .quellen b { font-weight: 700; color: var(--ink); }
.quellen span, .quellen small { display: block; font-size: 13px; } .quellen small { color: var(--muted); }

/* Nachschlagen: Seitenleiste */
.panelbg { position: fixed; inset: 0; z-index: 40; background: rgba(1, 1, 1, .35); }
.panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(440px, 100vw); background: var(--paper); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(1, 1, 1, .08); display: flex; flex-direction: column; }
.panel header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.panel h2 { font-size: 18px; font-weight: 800; color: var(--ink); } .panel h2:focus { outline: none; }
.pinhalt { padding: 6px 18px 28px; overflow: auto; }
.pinhalt h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 4px; }
.pinhalt ul, .pinhalt ol { margin: 0; padding-left: 20px; } .pinhalt li { margin-bottom: 4px; }
.musterbox { white-space: pre-wrap; background: var(--panel); border-radius: 9px; padding: 10px 14px; margin-top: 8px; overflow-wrap: anywhere; }
@media (min-width: 1440px) { .panelbg { display: none; } body.panel-offen #app { margin-right: 440px; } }
dialog .btns { flex-direction: column; align-items: stretch; }

@media (max-width: 620px) {
  .top nav { gap: 10px; }
  .modus a { padding: 5px 7px !important; }
  .brand span { display: none; }
  .drafts { grid-template-columns: 1fr; }
}

/* ===== Nachbesserungen nach dem Test mit vier Werkbänken (21.11.2026) ===== */
.cols > section { min-width: 0; }
/* Material bleibt beim Arbeiten im Blick: die linke Spalte klebt und rollt für sich */
@media (min-width: 800px) {
  .ex .left { position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 68px); overflow: auto; padding-right: 6px; }
}
.lines .tblwrap { margin: 0 0 8px; }
.matbild { display: block; max-width: 100%; height: auto; border-radius: 6px; margin-bottom: 8px; }
.wortlaut { position: relative; margin-bottom: 8px; }
.wortlaut pre { margin: 0; padding: 34px 12px 10px; background: var(--panel); border-radius: 9px; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 380px; overflow: auto; color: var(--text); }
.kopie { position: absolute; top: 5px; right: 6px; min-height: 26px; padding: 2px 10px; font-size: 12px; }
.pinhalt .wortlaut pre { max-height: none; }
.card, .opt, .tgt, .lnode, .titem { overflow-wrap: break-word; hyphens: auto; }

/* ===== Zweite Runde: Bausteine ===== */
.wlknoepfe { position: absolute; top: 5px; right: 6px; display: flex; gap: 6px; }
.wlknoepfe .btn { min-height: 26px; padding: 2px 10px; font-size: 12px; }
.ex .left .wortlaut pre { max-height: none; }
.vorspann { font-size: 13px; margin: 0 0 8px; }
.panel.breit { width: min(780px, 100vw); }
@media (min-width: 1440px) { body.panel-offen #app:has(~ #panel .breit) { margin-right: 780px; } }
.absatz { display: block; height: 8px; }
td, th { overflow-wrap: break-word; hyphens: manual; }
td:first-child, th:first-child { overflow-wrap: normal; word-break: keep-all; }
.tbr { overflow-wrap: break-word; hyphens: auto; }

/* ===== Dritte Runde: Arbeitsfläche – Vorrat klebt oben, Prüfen klebt unten ===== */
.leiste { position: sticky; bottom: 0; z-index: 7; background: var(--paper); margin-top: 12px; padding: 10px 0 12px; border-top: 1px solid var(--line); }
.leiste .btns { margin-top: 0; }
.leiste .fb { margin: 0 0 10px; max-height: 32vh; overflow: auto; }
.q, .schritt, .how { max-width: 760px; }
.f-auswahl .opts, .f-mehrfach .opts { max-width: 760px; }
.zwei { display: grid; gap: 12px 20px; }
@media (min-width: 1200px) { .ex { max-width: 1200px; } }
@media (min-width: 1100px) {
  .zwei { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .zwei .zv > .pool { margin-bottom: 0; }
  #work .zwei:not(.frei) > .zv > .pool { max-height: max(240px, calc(100vh - 136px)); overflow: auto; }
  .zwei .zz > .pk.kk, .zwei .zz > .teil { margin-top: 0; }
  .zwei .chips .card.add { width: 100%; font-size: 13px; line-height: 1.3; padding: 5px 10px; min-height: 32px; }
  .zwei .chips { gap: 6px; }
  .zwei.frei .opt { padding: 6px 10px; font-size: 13px; line-height: 1.4; }
  .zwei.frei .opts { gap: 6px; }
  .zwei.frei .opt b { font-size: 13px; }
  .zwei:not(.frei) { grid-template-columns: minmax(0, 4fr) minmax(0, 5fr); }
  .zwei .orow { font-size: 13px; line-height: 1.3; gap: 8px; }
  .zwei .orow .mv { width: 30px; height: 30px; min-width: 0; min-height: 0; }
  .zwei .orow .mvs { gap: 4px; }
  .lnode { min-height: 40px; padding: 6px 12px; }
  .lcol, .rcol { gap: 8px; }
  .body.f-bild, .body.f-punkt, .body.f-bildfolge { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 0 20px; align-items: start; }
  .body.f-bild > .pic, .body.f-punkt > .pic, .body.f-bildfolge > .pic { grid-column: 1; grid-row: 1 / span 5; margin-top: 0; position: sticky; top: 50px; }
  .body.f-bild > :not(.pic), .body.f-punkt > :not(.pic), .body.f-bildfolge > :not(.pic) { grid-column: 2; }
  .body.f-bild .legend { grid-template-columns: 1fr; }
  #work .body.f-bild > .pool, #work .body.f-punkt > .pool, #work .body.f-bildfolge > .pool { max-height: 56vh; }
  .titems:has(> .titem:nth-child(6)) { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
}
@media (min-width: 800px) and (min-height: 680px) {
  #work .body > .pool, #work .body > .stack, #work .body > .pens, .zwei:not(.frei) > .zv { position: sticky; top: 50px; z-index: 6; }
  #work .body > .pool, #work .body > .stack { max-height: 40vh; overflow: auto; box-shadow: 0 10px 10px -12px rgba(1, 1, 1, .45); }
  .zwei:not(.frei) > .zv > .pool { max-height: 40vh; overflow: auto; }
  #work .body > .pens { background: var(--paper); padding: 6px 0 8px; margin-bottom: 6px; box-shadow: 0 10px 10px -12px rgba(1, 1, 1, .45); }
}
/* Handy: Stifte und Etiketten bleiben als schmale Leiste stehen; die Erklärung zeigt nur der gewählte Stift */
@media (max-width: 799px) {
  #work .body > .pens { position: sticky; top: 44px; z-index: 6; background: var(--paper); padding: 6px 0 8px; margin-bottom: 6px; gap: 6px; box-shadow: 0 10px 10px -12px rgba(1, 1, 1, .45); }
  #work .body > .pens .pen { min-height: 36px; padding: 4px 10px; font-size: 13px; }
  #work .body > .pens .pen:not(.on) small { display: none; }
}
.pool, .stack, .tgt, .pk { user-select: none; -webkit-user-select: none; }

</style>

"Prüfprotokoll","d":"Die Liste, mit der du eine Ausgabe der KI Punkt für Punkt an den Regeln des Prompts misst."},{"t":"Kritischer Anteil","d":"Eine Stimme, an der sich entscheidet, ob die Ansprache ankommt."},{"t":"Reflexion","d":"Der Rückblick der KI: Welcher Absatz bedient welche Stimme, und wo ist die Rede angreifbar?"},{"t":"[TBD]","d":"Platzhalter für „noch zu klären“ (englisch: to be determined). Die KI setzt ihn, statt etwas zu erfinden."},{"t":"Briefing","d":"Die kurze Beschreibung, die zu diesem Prompt gehört."},{"t":"Abschnitt","d":"Ein Teil des Prompts mit eigener Überschrift, zum Beispiel ROLLE oder REGELN."},{"t":"Annahme","d":"Etwas, das man für wahr hält, ohne es geprüft zu haben."},{"t":"Lenkungskreis","d":"Die Runde der Entscheider über ein Projekt (nur in den Trainerfällen)."}],"sources":[{"t":"Prompt „Publikum modellieren“","u":"","ort":"Vorlage der Videoreihe, Datei Prompt.txt","n":"Wortlaut des Prompts in allen Übungen (Datei vom 21.11.2026)","stand":"21.11.2026","da":false},{"t":"Video-Briefing zum Prompt","u":"","ort":"Vorlage der Videoreihe, Datei Video-Briefing.docx","n":"Die zitierten Sätze zu Besonderheit, Eingaben, Ausgaben, Zielgruppe und Nutzen","stand":"21.11.2026","da":false},{"t":"Das Innere Team","u":"https://www.schulz-von-thun.de/die-modelle/das-innere-team","ort":"","n":"Herkunft des Begriffs „Inneres Team“; das Stimmenmodell mit „will“, „fürchtet“ und Antipode ist eine Arbeitshilfe dieses Prompts, kein psychologisches Verfahren","stand":"21.11.2026","da":false},{"t":"Fall aus dem Film","u":"","ort":"Vorlage der Videoreihe, Datei Fall.txt","n":"Nur gelesen, damit er in keiner Übung vorkommt","stand":"21.11.2026","da":false},{"t":"Fälle dieser Werkbank","u":"","ort":"Eigene Erfindung für diese Übungen","n":"Die Kurbelkiste, Jule Hartwig und der Samstagsdienst sowie Lotwerk, Deniz Aksoy und der Lenkungskreis sind erfunden; alle Ausgaben und die Beispielausgabe sind für die Übung geschrieben und stammen nicht aus einem KI-Lauf","stand":"21.11.2026","da":false}],"trainerIntro":["Elf eigene Fälle zum Vorführen: Deniz Aksoy will den Prompt für zehn Minuten vor einem Lenkungskreis nutzen. Die Aufgaben haben dieselbe Mechanik wie die Teilnehmerübungen, aber andere richtige Entscheidungen. Übe allein oder führe die Fälle mit der Gruppe vor. Lass die Gruppe jede Antwort an einer Stelle des Prompts belegen."],"bausteine":[{"id":"prompt","h":"Der Prompt · wörtlich","t":"# ROLLE\nDu hilfst mir, eine Rede zu bauen, die zu einem konkreten Publikum passt. Nicht der Text steht am Anfang, sondern das Publikum.\n\n# WAS DU BRAUCHST\nFrage mich nacheinander – immer nur EINE Frage, dann warten:\n\n1. „Welcher Anlass, welches Ziel, wie viel Zeit?“\n2. „Wer sitzt da? Anzahl, Rollen, Stimmung – und was wissen sie schon?“\n3. „Was soll nach der Rede anders sein? Ein Satz reicht.“\n\n# DAS MODELL\nJeder Zuhörer trägt mehrere innere Stimmen. Typische Stimmen und ihre Antipoden (die gegengerichtete Stimme, die sonst untergeht):\n\n| Stimme | will | fürchtet | Antipode |\n|---|---|---|---|\n| Skeptiker | Beweise | überredet zu werden | Vertrauender |\n| Pragmatiker | konkreten Nutzen | Aufwand ohne Ertrag | Visionär |\n| Statusbewusster | Anerkennung | Kontrollverlust | Teamorientierter |\n| Zeitknappe | den Punkt | Verschwendung | Genießer |\n| Betroffener | Sicherheit | Nachteil für sich | Unbeteiligter |\n| Wächter | Risiko verstehen | Überraschung | Abenteurer |\n\nDas ist ein Fundus, keine Liste zum Abschreiben. Leite die Anteile aus dem konkreten Publikum ab – auch andere als die sechs.\n\n# ABLAUF\n## Schritt 1 – Anteile\nNenne sechs Anteile für dieses Publikum. Je Anteil: Name, Motivation, Befürchtung, typische Reaktion auf meine Rede. Dann je Anteil den Antipoden, **fett** gesetzt, und in einem Satz, wie die beiden zusammenspielen.\n\n## Schritt 2 – Kritische Anteile\nEin Absatz: Welche zwei Anteile entscheiden über Erfolg oder Misserfolg? Begründe mit dem Anlass, nicht allgemein.\n\n## Schritt 3 – Rede\n350–400 Wörter, gesprochene Sprache, Du-Anrede.\nJeder Absatz bedient mindestens einen Anteil, ohne ihn zu nennen.\nKein Pathos, keine Floskeln, keine Aufzählung von Argumenten.\n\n## Schritt 4 – Reflexion\nTabelle: Absatz | bediente Anteile | warum diese Reihenfolge.\nDanach zwei Sätze: Wo ist die Rede angreifbar?\n\n# BEISPIEL (so soll das aussehen)\nEingabe: „3 Minuten, 20 Führungskräfte nach einem beschlossenen Sparprogramm.“ Ausgabe (Auszug):\n- Anteile: der Betroffene (fürchtet Stellenabbau in seinem Bereich),\n  der Wächter (prüft, ob die Zahlen stimmen), der Pragmatiker (will wissen, was morgen konkret passiert) …\n- Kritisch: Betroffener und Wächter – sie entscheiden, ob die Rede als Anerkennung oder als Rechtfertigung gehört wird.\n- Rede beginnt mit: „Sie haben entschieden, und Sie haben es nicht leicht gehabt.“ – nicht mit der Begründung der Entscheidung.\n\n# REGELN\n- Nenne in der Rede weder Anteile noch Antipoden.\n- Keine erfundenen Zahlen. Fehlt etwas: [TBD] und eine Rückfrage.\n- Eine Frage pro Runde. Kein Fragenkatalog.\n\n# PRÜFREGELN\nJeder Satz der Rede muss auf eine meiner Angaben zurückführbar sein. Ereignisse, Abstimmungen, Zusagen und Zuständigkeiten, die ich nicht genannt habe, kommen nicht vor.\n\n# BETRIEB\nLies meine erste Nachricht zuerst. Was dort schon steht, wird nicht erfragt, sondern in einem Halbsatz quittiert – frage nur, was fehlt.\nKeine erfundenen Fakten: keine Zahlen, Namen, Termine, Zitate, Referenzen, Zusagen oder Ereignisse, die nicht in meinen Angaben stehen. Fehlt etwas, markiere es als [TBD].\nFühre die Aufgabe zu Ende; höre nicht auf, um zu fragen, ob du weitermachen sollst.\nKeine Vorrede, keine Zusammenfassung des Gesprächs, kein Lob.\n\n# START\nBeginne mit Frage 1.","roh":true},{"id":"lesehilfe","h":"Lesehilfe zum Prompt","t":"Der Prompt hat neun Abschnitte. Jeder beginnt mit einer Zeile aus einem Rautezeichen und einer Überschrift in Großbuchstaben.\nDie vier Zeilen mit zwei Rautezeichen („## Schritt 1“ bis „## Schritt 4“) gehören zum Abschnitt ABLAUF.\nDie Zeilen mit senkrechten Strichen im Abschnitt „DAS MODELL“ sind eine Tabelle in Textform; die Zeile aus Strichen trennt nur die Kopfzeile ab.\nDas Beispiel im Prompt (20 Führungskräfte nach einem Sparprogramm) gehört zum Prompt und ist nicht dein Fall.\nPathos = übertrieben feierlicher Ton.\nFloskel = ein abgenutzter Satz, der nichts Bestimmtes sagt.\nAntipode = die Gegenstimme zu einer inneren Stimme.\n[TBD] steht für „noch zu klären“ (englisch: to be determined)."},{"id":"ausprobieren","h":"Mit einer echten KI ausprobieren","t":"Das ist freiwillig; alle Übungen funktionieren ohne KI.\nDie Werkbank selbst sendet nichts. Was du in die KI eingibst, geht an deren Anbieter.\nGib deshalb keine echten Namen und nichts Vertrauliches ein.\n  Schritt 1: Öffne in deiner KI ein neues Gespräch.\n  Schritt 2: Öffne das Material „Der Prompt · wörtlich“ und drücke „Kopieren“. Du findest es in dieser Übung oder unter „Nachschlagen · Material“. Füge den Prompt in das Gespräch ein und sende ihn ab.\n  Schritt 3: Die KI stellt ihre drei Fragen einzeln. Antworte auf jede mit der passenden Zeile, die du in der Übung vorbereitet hast, und warte dann auf die nächste Frage.\n  Schritt 4: Schreibe dazu, was offen ist: deine Zeile „Offen:“.\n  Schritt 5: Steht eine Angabe schon in deiner ersten Nachricht, soll die KI nicht noch einmal danach fragen. Tut sie es doch, ist das ein Punkt für dein Prüfprotokoll.\n  Schritt 6: Lies die Ausgabe und gehe das Prüfprotokoll durch.\n  Eigener Fall: Gehe genauso vor, diesmal mit den Zeilen für den eigenen Fall. Beginne ein neues Gespräch, damit die KI die beiden Fälle nicht vermischt. Miss die Ausgabe an der Zeile, in der du festgelegt hast, woran du sie prüfst.\n  Danach: Halte in der Rückblick-Übung fest, wie der Lauf gelungen ist."},{"id":"pruefprotokoll","h":"Prüfprotokoll für die Ausgabe der KI","t":"Zähle einen Punkt erst, wenn du die Stelle in der Ausgabe gefunden hast.\n  Punkt 1: Die KI hat ihre Fragen einzeln gestellt, jeweils auf meine Antwort gewartet und nichts doppelt gefragt.\n  Punkt 2: Sie nennt sechs Stimmen, jede mit „will“, „fürchtet“ und einer Gegenstimme.\n  Punkt 3: Sie begründet die zwei entscheidenden Stimmen mit meinem Anlass, nicht allgemein.\n  Punkt 4: In der Rede wird keine Stimme beim Namen genannt.\n  Punkt 5: In der Rede steht keine Zahl, die ich nicht genannt habe; Fehlendes ist mit [TBD] markiert.\n  Punkt 6: Jeder Satz der Rede geht auf eine meiner Angaben zurück; es kommen keine Ereignisse oder Zusagen vor, die ich nicht genannt habe.\n  Punkt 7: Am Ende stehen die Tabelle zu den Absätzen und zwei Sätze zur angreifbaren Stelle.\n  Hält die KI eine Regel nicht ein, schreibe ihr das in einem Satz. Zum Beispiel: „Du hast eine Zahl genannt, die ich nicht angegeben habe. Ersetze sie durch [TBD].“"},{"id":"beispielausgabe","h":"Beispielausgabe für die Arbeit ohne KI-Konto","still":true,"t":"Diese Ausgabe ist für die Übung geschrieben und gekürzt.\nSie stammt nicht aus einem echten KI-Lauf; eine echte KI formuliert anders.\nPrüfe sie mit den Punkten 2 bis 7 des Prüfprotokolls.\nPunkt 1 lässt sich nur an einem echten Gespräch prüfen, weil die Beispielausgabe die drei Fragen nicht zeigt.\n  Schritt 1 – Anteile\n  Betroffene – will: Sicherheit – fürchtet: dass es sie ständig trifft – Antipode: Unbeteiligte (Niemand bleibt außen vor)\n  Wächter – will: die Regel der Verteilung verstehen – fürchtet: Überraschungen – Antipode: Abenteurer (erst ausprobieren, dann festlegen)\n  Pragmatiker – will: wissen, wie man tauscht – fürchtet: Aufwand ohne Ertrag – Antipode: Visionär (der nächste Schritt vor dem großen Bild)\n  Statusbewusste – will: gefragt werden – fürchtet: übergangen werden – Antipode: Teamorientierte (mitreden statt mitgeteilt bekommen)\n  Zeitknappe – will: den Punkt – fürchtet: lange Vorreden – Antipode: Genießer (Kürze als Respekt)\n  Skeptiker – will: Belege – fürchtet: überredet werden – Antipode: Vertrauende (Offenes offen nennen)\n  Schritt 2 – Kritische Anteile: Betroffene und Wächter. Der Beschluss gilt; offen ist nur, wen es wie oft trifft und nach welcher Regel. Wer diese beiden Fragen in der ersten Minute nicht anspricht, wird als jemand gehört, der einen Beschluss verkauft.\n  Schritt 3 – Rede (Auszug): „Der Samstag steht fest, und ihr habt es per Mail erfahren. Ich weiß, dass das viele geärgert hat. Fest steht: ab 6. März, 9 bis 13 Uhr, drei von uns, dazu ein freier Tag in der Woche danach. Wie oft es jede und jeden trifft: [TBD]. Das hängt daran, ob Teilzeitkräfte ausgenommen werden, und das ist noch nicht entschieden. Tragt bis zum 9. Februar eure Wünsche für die Verteilung ein.“\n  Schritt 4 – Reflexion\n  Absatz 1 – Betroffene, Statusbewusste – anerkennen vor Fakten\n  Absatz 2 – Wächter, Zeitknappe – erst das Feststehende, kurz\n  Absatz 3 – Skeptiker, Wächter – Offenes offen nennen\n  Absatz 4 – Pragmatiker – ein greifbarer nächster Schritt\n  Angreifbar: Wünsche einzutragen ist ein Verfahren, keine Zusage. Wer eine feste Zahl erwartet, hört weiter eine Lücke.\n  Rückfrage: Bis wann entscheidet die Geschäftsführung über die Teilzeitkräfte?"}]},"bausteine":[{"id":"prompt","h":"Der Prompt · wörtlich","t":"# ROLLE\nDu hilfst mir, eine Rede zu bauen, die zu einem konkreten Publikum passt. Nicht der Text steht am Anfang, sondern das Publikum.\n\n# WAS DU BRAUCHST\nFrage mich nacheinander – immer nur EINE Frage, dann warten:\n\n1. „Welcher Anlass, welches Ziel, wie viel Zeit?“\n2. „Wer sitzt da? Anzahl, Rollen, Stimmung – und was wissen sie schon?“\n3. „Was soll nach der Rede anders sein? Ein Satz reicht.“\n\n# DAS MODELL\nJeder Zuhörer trägt mehrere innere Stimmen. Typische Stimmen und ihre Antipoden (die gegengerichtete Stimme, die sonst untergeht):\n\n| Stimme | will | fürchtet | Antipode |\n|---|---|---|---|\n| Skeptiker | Beweise | überredet zu werden | Vertrauender |\n| Pragmatiker | konkreten Nutzen | Aufwand ohne Ertrag | Visionär |\n| Statusbewusster | Anerkennung | Kontrollverl  vor.\n\n# BETRIEB\nLies meine erste Nachricht zuerst. Was dort schon steht, wird nicht erfragt, sondern in einem Halbsatz quittiert – frage nur, was fehlt.\nKeine erfundenen Fakten: keine Zahlen, Namen, Termine, Zitate, Referenzen, Zusagen oder Ereignisse, die nicht in meinen Angaben stehen. Fehlt etwas, markiere es als [TBD].\nFühre die Aufgabe zu Ende; höre nicht auf, um zu fragen, ob du weitermachen sollst.\nKeine Vorrede, keine Zusammenfassung des Gesprächs, kein Lob.\n\n# START\nBeginne mit Frage 1.","roh":true},{"id":"lesehilfe","h":"Lesehilfe zum Prompt","t":"Der Prompt hat neun Abschnitte. Jeder beginnt mit einer Zeile aus einem Rautezeichen und einer Überschrift in Großbuchstaben.\nDie vier Zeilen mit zwei Rautezeichen („## Schritt 1“ bis „## Schritt 4“) gehören zum Abschnitt ABLAUF.\nDie Zeilen mit senkrechten Strichen im Abschnitt „DAS MODELL“ sind eine Tabelle in Textform; die Zeile aus Strichen trennt nur die Kopfzeile ab.\nDas Beispiel im Prompt (20 Führungskräfte nach einem Sparprogramm) gehört zum Prompt und ist nicht dein Fall.\nPathos = übertrieben feierlicher Ton.\nFloskel = ein abgenutzter Satz, der nichts Bestimmtes sagt.\nAntipode = die Gegenstimme zu einer inneren Stimme.\n[TBD] steht für „noch zu klären“ (englisch: to be determined)."},{"id":"ausprobieren","h":"Mit einer echten KI ausprobieren","t":"Das ist freiwillig; alle Übungen funktionieren ohne KI.\nDie Werkbank selbst sendet nichts. Was du in die KI eingibst, geht an deren Anbieter.\nGib deshalb keine echten Namen und nichts Vertrauliches ein.\n  Schritt 1: Öffne in deiner KI ein neues Gespräch.\n  Schritt 2: Öffne das Material „Der Prompt · wörtlich“ und drücke „Kopieren“. Du findest es in dieser Übung oder unter „Nachschlagen · Material“. Füge den Prompt in das Gespräch ein und sende ihn ab.\n  Schritt 3: Die KI stellt ihre drei Fragen einzeln. Antworte auf jede mit der passenden Zeile, die du in der Übung vorbereitet hast, und warte dann auf die nächste Frage.\n  Schritt 4: Schreib chritt 1 – Anteile\n  Betroffene – will: Sicherheit – fürchtet: dass es sie ständig trifft – Antipode: Unbeteiligte (Niemand bleibt außen vor)\n  Wächter – will: die Regel der Verteilung verstehen – fürchtet: Überraschungen – Antipode: Abenteurer (erst ausprobieren, dann festlegen)\n  Pragmatiker – will: wissen, wie man tauscht – fürchtet: Aufwand ohne Ertrag – Antipode: Visionär (der nächste Schritt vor dem großen Bild)\n  Statusbewusste – will: gefragt werden – fürchtet: übergangen werden – Antipode: Teamorientierte (mitreden statt mitgeteilt bekommen)\n  Zeitknappe – will: den Punkt – fürchtet: lange Vorreden – Antipode: Genießer (Kürze als Respekt)\n  Skeptiker – will: Belege – fürchtet: überredet werden – Antipode: Vertrauende (Offenes offen nennen)\n  Schritt 2 – Kritische Anteile: Betroffene und Wächter. Der Beschluss gilt; offen ist nur, wen es wie oft trifft und nach welcher Regel. Wer diese beiden Fragen in der ersten Minute nicht anspricht, wird als jemand gehört, der einen Beschluss verkauft.\n  Schritt 3 – Rede (Auszug): „Der Samstag steht fest, und ihr habt es per Mail erfahren. Ich weiß, dass das viele geärgert hat. Fest steht: ab 6. März, 9 bis 13 Uhr, drei von uns, dazu ein freier Tag in der Woche danach. Wie oft es jede und jeden trifft: [TBD]. Das hängt daran, ob Teilzeitkräfte ausgenommen werden, und das ist noch nicht entschieden. Tragt bis zum 9. Februar eure Wünsche für die Verteilung ein.“\n  Schritt 4 – Reflexion\n  Absatz 1 – Betroffene, Statusbewusste – anerkennen vor Fakten\n  Absatz 2 – Wächter, Zeitknappe – erst das Feststehende, kurz\n  Absatz 3 – Skeptiker, Wächter – Offenes offen nennen\n  Absatz 4 – Pragmatiker – ein greifbarer nächster Schritt\n  Angreifbar: Wünsche einzutragen ist ein Verfahren, keine Zusage. Wer eine feste Zahl erwartet, hört weiter eine Lücke.\n  Rückfrage: Bis wann entscheidet die Geschäftsführung über die Teilzeitkräfte?"}],"ex":[{"id":"p01","title":"Was macht diesen Prompt besonders?","kicker":"Die eine Idee","goal":"Unterscheide die eine Idee des Prompts von seinen übrigen Eigenschaften.","case":["Jule Hartwig leitet den Kundenservice der Kurbelkiste, eines Onlinehändlers für Fahrradteile. Sie muss ihrem Team einen neuen Samstagsdienst erklären und hat dafür den Prompt „Publikum modellieren“ bekommen. Ein Kollege fragt: „Was ist daran besonders? Ein Prompt ist ein Prompt.“ Jule hat vier Eigenschaften notiert. Alle vier stimmen, aber nur eine ist die Idee."],"material":[{"h":"Zwei Aufträge im Vergleich","t":"Jules bisheriger Auftrag: „Schreibe eine motivierende Rede für mein Team zum Samstagsdienst.“ Die KI schrieb sofort los.\nDer Prompt „Publikum modellieren“ arbeitet so:\nEr beginnt mit dem Satz: „Nicht der Text steht am Anfang, sondern das Publikum.“\nEr stellt drei Fragen, immer nur eine: nach Anlass, Zuhörern und gewünschter Veränderung.\nEr arbeitet in vier nummerierten Schritten: Stimmen der Zuhörer, die zwei entscheidenden Stimmen, Rede, Rückblick.\nDie Rede hat 350 bis 400 Wörter in gesprochener Sprache.\nFehlt eine Angabe, setzt er [TBD] und fragt nach, statt eine Zahl zu erfinden."},{"h":"Begriffe einfach erklärt","t":"Prompt = der Auftrag, den du einer KI schreibst. Innere Stimme = ein Wunsch oder eine Sorge, die in einem Zuhörer mitredet, zum Beispiel „Trifft es mich?“. Der Prompt nennt diese Stimmen auch Anteile. [TBD] ist ein Platzhalter und steht für „noch zu klären“. Kontext = alles, was die KI über die Lage wissen muss. Output = das, was die KI ausgibt."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Alle vier Aussagen über den Prompt stimmen. Welche nennt die eine Idee, die ihn von einem gewöhnlichen Auftrag unterscheidet?","first":"Lies im Material, was der Prompt alles tut. Prüfe bei jeder Aussage: Könnte das auch in einem sorgfältigen gewöhnlichen Auftrag stehen?","hint":"Lies im Material, was der Prompt alles tut. Prüfe bei jeder Aussage: Könnte das auch in einem sorgfältigen gewöhnlichen Auftrag stehen?","success":"Du kennst die eine Idee des Prompts: Kontext vor Output, also erst die Lage klären und dann schreiben lassen. Schritte, Zahlenregel und Länge sind Eigenschaften, die auch andere Prompts haben. Dass die Zuhörer vor dem Text kommen, hat nur dieser.","model":"Er klärt zuerst, wer zuhört: Er fragt nach den Zuhörern und beschreibt ihre Stimmen, bevor er die Rede schreibt. Die anderen drei Aussagen stimmen, könnten aber in jedem sorgfältigen Auftrag stehen.","guide":{"why":"Wenn du weißt, was ein Prompt anders macht, kannst du entscheiden, ob er zu deiner Aufgabe passt. Du erkennst dann auch, ob die KI ihn wirklich befolgt oder einfach losschreibt.","pre":["Prompt: der Auftrag an die KI.","Innere Stimme (Anteil): ein Wunsch oder eine Sorge eines Zuhörers.","[TBD]: Platzhalter für „noch zu klären“."],"steps":["Lies im Material die fünf Zeilen dazu, wie der Prompt arbeitet.","Prüfe jede Aussage mit der Frage: Hätte Jule das auch in ihren alten Auftrag schreiben können, ohne dass er ein anderer Auftrag wird?","Klicke Prüfen und lies die Begründung."],"example":"Zwei Schneiderinnen nähen beide sauber und halten beide den Termin. Besonders ist die, die zuerst Maß nimmt.","pitfalls":"Eine wahre Aussage ist noch nicht die richtige Antwort. Schritte, Zahlenregel und Länge stimmen alle, beschreiben aber nicht die Idee.","criteria":"Die Antwort nennt, was vor dem Schreiben geschieht, und lässt sich mit einem Satz aus dem Prompt belegen.","rationale":["Der Prompt sagt es selbst im ersten Abschnitt: Am Anfang steht das Publikum.","Vor der Rede stehen die drei Fragen, die Beschreibung der Stimmen und die Wahl der zwei entscheidenden."],"goal":""},"trainer":false,"kind":"choice","layout":"auswahl","formName":"Einzelauswahl","multi":false,"options":[{"id":"o1","label":"Er arbeitet in festen Schritten","text":"Er gibt der KI einen Ablauf mit vier nummerierten Schritten vor.","ok":false,"why":"Das stimmt, aber feste Schritte haben viele Prompts. Entscheidend ist, wem die ersten beiden Schritte gelten: den Zuhörern, nicht dem Text."},{"id":"o2","label":"Er verbietet erfundene Zahlen","text":"Er verlangt [TBD] und eine Rückfrage, wenn eine Angabe fehlt.","ok":false,"why":"Das ist eine Regel, die das Ergebnis absichert. Sie macht den Prompt zuverlässiger, aber nicht anders: Auch ein gewöhnlicher Auftrag könnte sie enthalten."},{"id":"o3","label":"Er klärt zuerst, wer zuhört","text":"Er fragt nach den Zuhörern und beschreibt ihre Stimmen, bevor er ein Wort der Rede schreibt.","ok":true,"why":"So steht es im Prompt: Nicht der Text steht am Anfang, sondern das Publikum."},{"id":"o4","label":"Er begrenzt die Länge","text":"Er legt die Rede auf 350 bis 400 Wörter in gesprochener Sprache fest.","ok":false,"why":"Auch das stimmt, ist aber eine Vorgabe für die Form. Sie sagt nichts darüber, für wen die Rede geschrieben wird."}]},{"id":"p02","title":"Warum wird der Prompt eingesetzt?","kicker":"Der Nutzen","goal":"Benenne das Problem, das der Prompt löst, und grenze es von naheliegenden anderen ab.","case":["Jule fragt sich, ob sich der Umweg über das Publikum lohnt. Ihr erster Versuch mit dem alten Auftrag liegt vor ihr. Sie will genau wissen, woran er gescheitert ist."],"material":[{"h":"Der erste Versuch und die Reaktion","t":"Jules alter Auftrag lieferte eine Rede, die so begann: „Liebes Team, der Samstagsdienst macht uns für unsere Kundschaft besser erreichbar. Dafür sprechen fünf Gründe.“ Jule las sie zwei Kolleginnen vor. Beide sagten: „Dass der Samstag kommt, wissen wir. Wir wollen wissen, wie oft es uns trifft.“ An den fünf Gründen zweifelte niemand. Zu lang oder zu kühl fand die Rede auch niemand."},{"h":"So steht es im Briefing zum Prompt","t":"„Der teuerste Fehler bei Reden ist nicht der Inhalt, sondern die Annahme über das Publikum. Der Prompt macht diese Annahme sichtbar, bevor sie teuer wird.“ Annahme = etwas, das man für wahr hält, ohne es geprüft zu haben. Briefing = die kurze Beschreibung, die zu diesem Prompt gehört; die Sätze, die du brauchst, stehen hier im Material."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Woran ist Jules erste Rede gescheitert, und was ändert der Prompt daran?","first":"Lies zuerst, was Jules Kolleginnen zur ersten Rede sagten und was sie nicht bemängelten. Wähle dann eine Antwort.","hint":"Lies zuerst, was Jules Kolleginnen zur ersten Rede sagten und was sie nicht bemängelten. Wähle dann eine Antwort.","success":"Du kannst begründen, wozu der Prompt da ist: Er macht sichtbar, was du über deine Zuhörer nur annimmst. Jules erste Rede war weder zu lang noch falsch noch zu kühl. Sie beantwortete eine Frage, die niemand gestellt hatte.","model":"Die Rede scheiterte an einem falschen Bild der Zuhörer: Jule nahm an, das Team brauche Gründe. Der Prompt legt solche Annahmen offen, bevor die Rede gehalten wird.","guide":{"why":"Ein Werkzeug setzt du nur richtig ein, wenn du sein Problem kennst. Sonst erwartest du Kürze, Wärme oder mehr Text und übersiehst den eigentlichen Nutzen.","pre":["Annahme: etwas, das man für wahr hält, ohne es geprüft zu haben.","Briefing: die kurze Beschreibung, die zu diesem Prompt gehört."],"steps":["Lies, was die beiden Kolleginnen sagten, und notiere dir gedanklich auch, was sie nicht bemängelten.","Streiche jede Antwort, deren Mangel im Material ausdrücklich verneint wird.","Vergleiche die übrige Antwort mit dem Satz aus dem Briefing und klicke Prüfen."],"example":"Wer ein Geschenk kauft, ohne den Beschenkten zu kennen, scheitert selten am Preis oder an der Verpackung. Er scheitert an der Vorstellung, was dem anderen gefällt.","pitfalls":"Der Prompt enthält auch Regeln zu Länge, Ton und erfundenen Angaben. Deshalb wirken diese Antworten richtig. Sie beschreiben aber Nebenwirkungen, nicht den Zweck.","criteria":"Die Antwort erklärt, warum eine Rede mit guten Gründen, passender Länge und passendem Ton trotzdem nicht ankommt.","rationale":["Die erste Rede beantwortete eine Frage, die niemand gestellt hatte.","Das Briefing nennt die Annahme über das Publikum als teuersten Fehler."],"goal":""},"trainer":false,"kind":"choice","layout":"auswahl","formName":"Einzelauswahl","multi":false,"options":[{"id":"o1","label":"An der Länge","text":"Fünf Gründe waren zu viel; der Prompt kürzt die Rede auf das Wesentliche.","ok":false,"why":"Zu lang fand die Rede niemand. Die Kolleginnen vermissten eine Antwort auf ihre Frage, nicht Kürze."},{"id":"o2","label":"An falschen Angaben","text":"Die Gründe waren erfunden; der Prompt verbietet erfundene Angaben.","ok":false,"why":"An den Gründen zweifelte niemand. Das Verbot von Erfundenem steht zwar im Prompt, ist aber nicht der Grund, warum man ihn einsetzt."},{"id":"o3","label":"Am Ton","text":"Die Rede klang zu kühl; der Prompt lässt die KI wärmer formulieren.","ok":false,"why":"Den Ton hat niemand bemängelt. Der Prompt verlangt sogar: kein Pathos, keine Floskeln."},{"id":"o4","label":"An einem falschen Bild der Zuhörer","text":"Jule nahm an, das Team brauche Gründe; der Prompt deckt solche Annahmen auf.","ok":true,"why":"Genau das nennt das Briefing als Grund: die Annahme über das Publikum sichtbar machen, bevor sie teuer wird."}]},{"id":"p03","title":"Was kann ich damit machen?","kicker":"Einsatzfälle","goal":"Unterscheide Anlässe, für die der Prompt gebaut ist, von solchen, die ihm nur ähneln.","case":["Jule will den Prompt an Kolleginnen und Kollegen weitergeben. Fünf von ihnen haben einen Anlass genannt. Bei allen fünf geht es um Menschen, aber nur für zwei ist der Prompt gebaut."],"material":[{"h":"Wofür der Prompt gebaut ist","t":"Im Briefing steht: „Für alle, die zu Menschen sprechen: Führungskräfte, Trainer, Vertrieb, Change-Begleiter.“ Change-Begleiter erklären und begleiten eine Veränderung im Betrieb.\nDer Prompt fragt: „Wer sitzt da? Anzahl, Rollen, Stimmung – und was wissen sie schon?“ Er rechnet also mit mehreren Zuhörern in einem Raum.\nEr liefert eine zusammenhängende Rede von 350 bis 400 Wörtern in gesprochener Sprache. Das sind wenige Minuten Redezeit."},{"h":"Fünf Anlässe","t":"Anlass 1: Ein Schichtleiter erklärt 15 Kolleginnen und Kollegen in der Frühbesprechung, warum ab Montag eine neue Sicherheitsregel gilt.\nAnlass 2: Eine Personalleiterin schreibt eine Rundmail an 300 Beschäftigte über die neue Urlaubsregelung.\nAnlass 3: Eine Vertriebsleiterin eröffnet ein Treffen mit 30 Stammkunden und kündigt eine Preisanpassung an.\nAnlass 4: Ein Einkäufer bereitet sich auf die Verhandlung mit einem einzelnen Lieferanten vor.\nAnlass 5: Ein Referent hält auf einer Tagung einen Fachvortrag von 45 Minuten."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Für welche zwei Anlässe ist dieser Prompt gebaut?","first":"Lies genau, was der Prompt liefert: welche Art von Text, wie lang und für wen. Prüfe dann jeden Anlass an diesen drei Punkten.","hint":"Lies genau, was der Prompt liefert: welche Art von Text, wie lang und für wen. Prüfe dann jeden Anlass an diesen drei Punkten.","success":"Du kannst einschätzen, wofür der Prompt gebaut ist: für eine kurze, gesprochene Ansprache vor mehreren Menschen in einem Raum. Die Frühbesprechung und das Kundentreffen passen. Die Rundmail wird gelesen, die Verhandlung ist ein Gespräch, der Fachvortrag ist viel zu lang.","model":"Anlass 1 und Anlass 3: In beiden spricht jemand wenige Minuten zu mehreren Menschen in einem Raum, und es kommt darauf an, wie sie die Botschaft aufnehmen.","guide":{"why":"Ein guter Prompt löst eine bestimmte Aufgabe. Wer ihn für alles nimmt, was mit Menschen zu tun hat, bekommt unpassende Ergebnisse und hält den Prompt für schlecht.","pre":["Anlass: die Gelegenheit, bei der gesprochen wird.","Gesprochene Sprache: Sätze, die man gut vorlesen und hören kann."],"steps":["Lies im Material die drei Merkmale: gesprochen, wenige Minuten, mehrere Zuhörer in einem Raum.","Prüfe jeden Anlass an allen drei Merkmalen; ein Merkmal, das fehlt, genügt zum Ausschluss.","Wähle genau zwei Anlässe und klicke Prüfen."],"example":"Ein Brotmesser schneidet auch Tomaten, aber schlecht. Dass etwas ähnlich aussieht, macht das Werkzeug noch nicht passend.","pitfalls":"Auch bei der Rundmail, der Verhandlung und dem Fachvortrag hilft es, über die Zuhörer nachzudenken. Die Rede, die der Prompt schreibt, passt dort trotzdem nicht.","criteria":"Beide gewählten Anlässe sind kurz, werden gesprochen und haben mehrere Zuhörer in einem Raum.","rationale":["Die Frage „Wer sitzt da?“ setzt mehrere Zuhörer in einem Raum voraus.","Länge und gesprochene Sprache sind im Schritt „Rede“ festgelegt; daran scheitern Fachvortrag und Rundmail."],"goal":""},"trainer":false,"kind":"choice","layout":"mehrfach","formName":"Mehrfachauswahl","multi":true,"options":[{"id":"o1","label":"Anlass 1","text":"Frühbesprechung: neue Sicherheitsregel vor 15 Kolleginnen und Kollegen.","ok":true,"why":"Mehrere Zuhörer in einem Raum, wenige Minuten, und es kommt darauf an, wie sie die Regel aufnehmen. Dafür ist der Prompt gebaut."},{"id":"o2","label":"Anlass 2","text":"Rundmail an 300 Beschäftigte zur neuen Urlaubsregelung.","ok":false,"why":"Eine Rundmail wird gelesen, nicht gehört. Der Prompt schreibt gesprochene Sprache und fragt, wer im Raum sitzt."},{"id":"o3","label":"Anlass 3","text":"Kundentreffen: Preisanpassung vor 30 Stammkunden.","ok":true,"why":"Der Vertrieb ist ausdrücklich genannt. Die Kunden sitzen im Raum und bringen Sorgen mit, die der Prompt als Stimmen beschreibt."},{"id":"o4","label":"Anlass 4","text":"Verhandlung mit einem einzelnen Lieferanten.","ok":false,"why":"Eine Verhandlung ist ein Gespräch mit Rede und Gegenrede. Der Prompt liefert eine zusammenhängende Rede für mehrere Zuhörer, keinen Gesprächsverlauf."},{"id":"o5","label":"Anlass 5","text":"Fachvortrag von 45 Minuten auf einer Tagung.","ok":false,"why":"Der Prompt liefert 350 bis 400 Wörter, also wenige Minuten. Für 45 Minuten Fachvortrag ist er nicht gebaut."}]},{"id":"p04","title":"Was kommt herein, was kommt heraus?","kicker":"Eingabe und Ausgabe","goal":"Trenne, was du vorbereitest, was der Prompt liefert und was er gar nicht leistet.","case":["Jule will den Prompt morgen ausprobieren. Sie fragt: „Was muss ich mitbringen, was bekomme ich zurück, und was darf ich nicht erwarten?“"],"material":[{"h":"Aus dem Prompt · Was du brauchst","t":"Der Prompt fragt nacheinander:\n„Welcher Anlass, welches Ziel, wie viel Zeit?“\n„Wer sitzt da? Anzahl, Rollen, Stimmung – und was wissen sie schon?“\n„Was soll nach der Rede anders sein? Ein Satz reicht.“"},{"h":"Aus dem Prompt und dem Briefing · Was herauskommt","t":"Das Briefing fasst zusammen: „Sechs Anteile mit Antipoden, zwei als kritisch markiert, eine Rede von 350–400 Wörtern und eine Tabelle, die zeigt, welcher Absatz welchen Anteil bedient.“ Der Prompt verlangt am Ende außerdem „zwei Sätze: Wo ist die Rede angreifbar?“ Mehr liefert er nicht.\nAnteil = innere Stimme eines Zuhörers. Antipode = die Gegenstimme dazu: Wer vor allem Risiken verstehen will, hat als Gegenstimme die Lust, etwas zu wagen. Kritisch markiert heißt: Diese zwei Stimmen entscheiden, ob die Rede ankommt. Angreifbar ist eine Stelle, an der Zuhörer widersprechen könnten."},{"h":"Ein Ergebnis zum Anschauen","t":"Für Jules Fall könnte die KI als eine der Stimmen nennen: „Betroffene – wollen Sicherheit, fürchten, dass es sie ständig trifft.“ Die Rede könnte so beginnen: „Der Samstag steht fest, und ihr habt es per Mail erfahren.“ Eine gekürzte Beispielausgabe findest du später in der Übung „Wie bin ich mit dem Prompt klargekommen?“."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Ordne acht Karten zu: Bereitest du das vor, liefert es der Prompt, oder leistet er es gar nicht?","first":"Lies die drei Fragen des Prompts und die Liste der Ergebnisse im Material. Nimm die Karte mit dem Anlass und lege sie in das passende Feld.","hint":"Lies die drei Fragen des Prompts und die Liste der Ergebnisse im Material. Nimm die Karte mit dem Anlass und lege sie in das passende Feld.","success":"Du weißt, was du vorbereitest, was du bekommst und was du nicht erwarten darfst. Herein kommen Anlass mit Ziel und Zeit, die Zuhörer mit Stimmung und Vorwissen und der Satz zur Veränderung. Heraus kommen Stimmen mit Gegenstimmen, die zwei entscheidenden Stimmen, die Rede und die angreifbare Stelle. Folien und ein Urteil über den Anlass leistet der Prompt nicht. Merke: Alles, was nur du wissen kannst, kommt von dir.","model":"Herein: Anlass, Ziel und Zeitrahmen; Stimmung und Vorwissen der Zuhörer; der Satz zur Veränderung. Heraus: die Gegenstimmen; die zwei entscheidenden Stimmen; die angreifbare Stelle. Weder noch: Folien; ein Urteil über den Samstagsdienst.","guide":{"why":"Wer die Eingaben kennt, sitzt nicht ratlos vor der ersten Frage der KI. Wer die Ausgaben und die Grenzen kennt, merkt, wenn etwas fehlt, und erwartet nichts, was der Prompt nicht kann.","pre":["Anteil: innere Stimme eines Zuhörers.","Antipode: die Gegenstimme zu einem Anteil.","Angreifbar: eine Stelle, an der Zuhörer widersprechen könnten."],"steps":["Lies die drei Fragen des Prompts; sie nennen alles, was hereinkommt.","Lies die Liste der Ergebnisse. Was dort nicht steht und auch keine Frage ist, leistet der Prompt nicht.","Ordne alle acht Karten zu und klicke Prüfen."],"example":"Beim Schneider bringst du Maße und Anlass mit. Anzug und Rechnung bekommst du zurück. Schuhe bekommst du dort nicht.","pitfalls":"Die zwei entscheidenden Stimmen wirken wie etwas, das man selbst wissen muss. Der Prompt bestimmt sie aber aus deinen Angaben.","criteria":"Alles, was nur du wissen kannst, liegt bei „Kommt herein“, und nichts liegt bei „Kommt heraus“, was nicht in der Liste der Ergebnisse steht.","rationale":["Die drei Fragen im Abschnitt „Was du brauchst“ sind die Eingaben.","Stimmen, Gegenstimmen, entscheidende Stimmen, Rede, Tabelle und angreifbare Stelle sind die vollständige Liste der Ergebnisse."],"goal":""},"trainer":false,"kind":"place","layout":"spalten","formName":"Felder","targets":[{"id":"f1","label":"Kommt herein","sub":"das bereite ich vor","cap":0},{"id":"f2","label":"Kommt heraus","sub":"das liefert der Prompt","cap":0},{"id":"f3","label":"Weder noch","sub":"das leistet der Prompt nicht","cap":0}],"cards":[{"id":"k1","text":"Anlass, Ziel und Zeitrahmen","target":"f1","why":"Danach fragt der Prompt in Frage 1. Diese Angaben kennst nur du."},{"id":"k2","text":"Die Stimmung im Raum und was die Zuhörer schon wissen","target":"f1","why":"Das gehört zu Frage 2. Ohne diese Angaben müsste die KI raten."},{"id":"k4","text":"Zu jeder Stimme die Gegenstimme","target":"f2","why":"Die Gegenstimmen nennt der Prompt selbst, zusammen mit den sechs Stimmen."},{"id":"k5","text":"Welche zwei Stimmen über den Erfolg entscheiden","target":"f2","why":"Das bestimmt der Prompt und begründet es mit deinem Anlass. Du musst es vorher nicht wissen."},{"id":"k8","text":"Ein Urteil, ob der Samstagsdienst richtig ist","target":"f3","why":"Der Prompt bewertet den Anlass nicht. Er hilft, über ihn zu sprechen."},{"id":"k3","text":"Ein Satz: Was soll danach anders sein?","target":"f1","why":"Das ist Frage 3. Das Ziel legst du fest, nicht die KI."},{"id":"k6","text":"Zwei Sätze dazu, wo die Rede angreifbar ist","target":"f2","why":"Die angreifbare Stelle nennt der Prompt am Ende selbst."},{"id":"k7","text":"Folien zur Rede","target":"f3","why":"Folien stehen weder bei den Fragen noch bei den Ergebnissen. Der Prompt liefert Text, keine Präsentation."}]},{"id":"p05","title":"Wie läuft der Prompt ab?","kicker":"Ablauf","goal":"Bringe sechs Arbeitsschritte des Prompts in die Reihenfolge, in der er arbeitet.","case":["Jule hat den Prompt gestartet. Sie will wissen, was der Reihe nach geschieht, damit sie nicht ungeduldig nach der Rede fragt und erkennt, wenn die KI etwas überspringt."],"material":[{"h":"Aus dem Prompt · Ablauf","t":"„Frage mich nacheinander – immer nur EINE Frage, dann warten.“ Danach folgen vier Schritte.\nSchritt 1 – Anteile: sechs Anteile für dieses Publikum, je mit Motivation und Befürchtung. Dann zu jedem Anteil den Antipoden und in einem Satz
