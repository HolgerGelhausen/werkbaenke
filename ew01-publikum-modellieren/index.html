, wie die beiden zusammenspielen.\nSchritt 2 – Kritische Anteile: „Welche zwei Anteile entscheiden über Erfolg oder Misserfolg? Begründe mit dem Anlass, nicht allgemein.“\nSchritt 3 – Rede: „Jeder Absatz bedient mindestens einen Anteil, ohne ihn zu nennen.“\nSchritt 4 – Reflexion: eine Tabelle zu Absatz, bedienten Anteilen und Reihenfolge; danach zwei Sätze: Wo ist die Rede angreifbar?"},{"h":"Begriffe einfach erklärt","t":"Anteil = innere Stimme eines Zuhörers. Antipode = die Gegenstimme dazu: Wer vor allem Risiken verstehen will, hat als Gegenstimme die Lust, etwas zu wagen. Kritisch heißt hier: entscheidend für den Erfolg. Reflexion = der Rückblick der KI auf ihre Rede. Angreifbar ist eine Stelle, an der Zuhörer widersprechen könnten."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Bringe die sechs Karten in die Reihenfolge, in der der Prompt arbeitet.","first":"Lies den Ablauf im Material. Suche die Karte mit den Fragen und schiebe sie an den Anfang.","hint":"Lies den Ablauf im Material. Suche die Karte mit den Fragen und schiebe sie an den Anfang.","success":"Du kennst den Weg des Prompts: erst fragen, dann Stimmen und Gegenstimmen nennen, dann die zwei entscheidenden bestimmen, dann schreiben, zuletzt zurückblicken. Vor der Rede liegen also die Fragen und die ganze Analyse der Zuhörer. Den ganzen Prompt liest du im Material „Der Prompt · wörtlich“.","model":"1. Fragen, eine nach der anderen. 2. Sechs Stimmen. 3. Die Gegenstimmen. 4. Die zwei entscheidenden Stimmen. 5. Die Rede. 6. Tabelle und angreifbare Stelle.","guide":{"why":"Wer den Ablauf kennt, lässt die KI ausreden. Du erkennst auch, wenn sie einen Schritt überspringt, zum Beispiel die Gegenstimmen, und sofort die Rede liefert.","pre":["Kritischer Anteil: eine Stimme, die über den Erfolg entscheidet.","Reflexion: der Rückblick der KI auf ihre eigene Rede."],"steps":["Lies den Ablauf im Material: erst die Fragen, dann vier Schritte. Schritt 1 hat zwei Teile, Stimmen und Gegenstimmen.","Frage dich bei jeder Karte: Was muss schon vorliegen, damit dieser Schritt möglich ist?","Verschiebe die Karten mit den Pfeilen und klicke Prüfen."],"example":"Eine Ärztin fragt, untersucht, stellt die Diagnose und verschreibt erst dann. Das Rezept kommt nicht vor der Untersuchung.","pitfalls":"Die Rede fühlt sich wie das Ziel an und rutscht deshalb zu weit nach vorn. Vor ihr liegen die Fragen, die Stimmen, die Gegenstimmen und die Wahl der zwei entscheidenden.","criteria":"Jeder Schritt steht hinter dem, worauf er aufbaut.","rationale":["Die Fragen stehen im Prompt vor dem Abschnitt „Ablauf“.","Die Schritte 1 bis 4 sind im Prompt nummeriert; Stimmen und Gegenstimmen gehören beide zu Schritt 1, die Reflexion setzt die fertige Rede voraus."],"goal":""},"trainer":false,"kind":"order","layout":"liste","formName":"Reihenfolge","items":[{"id":"s1","text":"Die KI fragt nach Anlass, Zuhörern und gewünschter Veränderung, immer nur eine Frage.","why":"Ohne deine Antworten hat die KI nichts, woraus sie Stimmen ableiten kann."},{"id":"s2","text":"Sie nennt sechs Stimmen der Zuhörer, je mit dem, was sie wollen und fürchten.","why":"Die Stimmen sind der Anfang von Schritt 1; alles Weitere baut auf ihnen auf."},{"id":"s3","text":"Sie nennt zu jeder Stimme die Gegenstimme und wie beide zusammenspielen.","why":"Eine Gegenstimme gibt es erst, wenn die Stimme genannt ist. Beides gehört zu Schritt 1."},{"id":"s4","text":"Sie bestimmt die zwei entscheidenden Stimmen und begründet das mit dem Anlass.","why":"Erst wenn alle Stimmen und Gegenstimmen vorliegen, lässt sich sagen, welche zwei entscheiden."},{"id":"s5","text":"Sie schreibt die Rede; jeder Absatz bedient mindestens eine Stimme.","why":"Die Rede soll die Stimmen bedienen; deshalb kommt sie nach der Analyse."},{"id":"s6","text":"Sie zeigt in einer Tabelle, welcher Absatz welche Stimme bedient, und nennt die angreifbare Stelle.","why":"Zurückblicken kann die KI erst, wenn die Rede geschrieben ist."}],"correct":["s1","s2","s3","s4","s5","s6"],"start":["s2","s6","s1","s5","s4","s3"]},{"id":"p06","title":"Wozu dient welcher Abschnitt?","kicker":"Aufbau des Prompts","goal":"Ordne jedem Abschnitt des Prompts seine Aufgabe zu.","case":["Jule hat den Prompt zum ersten Mal ganz gelesen. Er hat neun Abschnitte mit Überschriften. Sie will verstehen, wozu jeder Abschnitt da ist, damit sie später eigene Prompts so aufbauen kann."],"material":[{"h":"Die Abschnitte des Prompts","t":"Jeder Abschnitt beginnt mit einem Rautezeichen und einer Überschrift: ROLLE, WAS DU BRAUCHST, DAS MODELL, ABLAUF, BEISPIEL, REGELN, PRÜFREGELN, BETRIEB, START. Im Material „Der Prompt · wörtlich“ liest du den ganzen Text. Der Abschnitt START besteht nur aus einem Satz: „Beginne mit Frage 1.“"},{"h":"Vier Aufgaben, die ein Abschnitt haben kann","t":"Auftrag: Die KI erfährt, was ihre Aufgabe ist.\nEingaben: Die KI holt Angaben ein, die nur du kennst.\nVorgehen: Die KI bekommt ein Denkwerkzeug und feste Schritte.\nZielbild und Grenzen: Die KI sieht ein Beispiel und erfährt, was verboten ist."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Ordne sechs der neun Abschnitte des Prompts ihrer Aufgabe zu.","first":"Öffne den Prompt und lies die Überschriften. Nimm dann die Karte „ROLLE“ und lege sie in das passende Feld.","hint":"Öffne den Prompt und lies die Überschriften. Nimm dann die Karte „ROLLE“ und lege sie in das passende Feld.","success":"Du kannst den Prompt lesen wie einen Bauplan: Die Rolle klärt die Aufgabe, „Was du brauchst“ holt die Eingaben, Modell und Ablauf legen das Vorgehen fest, Beispiel und Regeln sichern das Ergebnis. Die drei übrigen Abschnitte sind schnell eingeordnet: PRÜFREGELN und BETRIEB setzen weitere Grenzen, START löst die erste Frage aus. Diese vier Aufgaben findest du in vielen guten Prompts wieder.","model":"ROLLE gehört zu Auftrag. WAS DU BRAUCHST gehört zu Eingaben. DAS MODELL und ABLAUF gehören zu Vorgehen. BEISPIEL und REGELN gehören zu Zielbild und Grenzen.","guide":{"why":"Wer die Aufgabe jedes Abschnitts kennt, kann einen Prompt anpassen, ohne ihn zu zerstören. Du erkennst auch, welcher Abschnitt fehlt, wenn ein eigener Prompt schlechte Ergebnisse liefert.","pre":["Abschnitt: ein Teil des Prompts mit eigener Überschrift.","Denkwerkzeug (Modell): eine Vorlage, nach der die KI etwas ordnet."],"steps":["Öffne den Prompt und lies die neun Überschriften.","Frage dich bei jeder Karte: Erfährt die KI hier ihre Aufgabe, holt sie Angaben ein, bekommt sie ein Vorgehen oder eine Grenze?","Ordne alle sechs Karten zu und klicke Prüfen."],"example":"Auch ein Rezept hat feste Teile: Zutaten sind die Eingaben, die Zubereitung ist das Vorgehen, das Foto zeigt das Zielbild.","pitfalls":"Das Beispiel wirkt wie ein Teil des Vorgehens. Es zeigt aber kein Vorgehen, sondern wie das Ergebnis aussehen soll.","criteria":"Jeder Abschnitt liegt bei der Aufgabe, die er im Prompt tatsächlich erfüllt.","rationale":["Modell und Ablauf sagen, womit und in welchen Schritten gearbeitet wird.","Beispiel und Regeln beschreiben das Ergebnis: einmal als Vorbild, einmal als Verbot."],"goal":""},"trainer":false,"kind":"place","layout":"spalten","formName":"Felder","targets":[{"id":"f1","label":"Auftrag","sub":"sagt der KI, was ihre Aufgabe ist","cap":0},{"id":"f2","label":"Eingaben","sub":"holt die nötigen Angaben bei dir ab","cap":0},{"id":"f3","label":"Vorgehen","sub":"gibt Denkwerkzeug und Schritte vor","cap":0},{"id":"f4","label":"Zielbild und Grenzen","sub":"zeigt das Ergebnis und was verboten ist","cap":0}],"cards":[{"id":"k5","text":"BEISPIEL: „so soll das aussehen“","target":"f4","why":"Das Beispiel zeigt das Zielbild; daran richtet die KI ihr Ergebnis aus."},{"id":"k3","text":"DAS MODELL: Tabelle mit Stimme, will, fürchtet, Antipode","target":"f3","why":"Das Modell ist das Denkwerkzeug, mit dem die KI die Zuhörer beschreibt."},{"id":"k6","text":"REGELN: keine erfundenen Zahlen, Stimmen nicht nennen","target":"f4","why":"Regeln setzen Grenzen für das Ergebnis."},{"id":"k2","text":"WAS DU BRAUCHST: drei Fragen, immer nur eine","target":"f2","why":"Mit diesem Abschnitt holt die KI die Angaben bei dir ab."},{"id":"k1","text":"ROLLE: „Du hilfst mir, eine Rede zu bauen, die zu einem konkreten Publikum passt.“","target":"f1","why":"Die Rolle sagt der KI in einem Satz, was ihre Aufgabe ist."},{"id":"k4","text":"ABLAUF: Schritt 1 bis Schritt 4","target":"f3","why":"Der Ablauf legt fest, in welcher Reihenfolge gearbeitet wird."}]},{"id":"p07","title":"Welche Regel verhindert welchen Fehler?","kicker":"Regeln des Prompts","goal":"Verbinde jeden Fehler mit der Regel, die ihn verhindert.","case":["Jule hat den Prompt mehrmals ausprobiert. Sechs Dinge sind dabei schiefgegangen, weil sie einzelne Regeln versehentlich gelöscht hatte. Sie will wissen, welche Regel welchen Fehler verhindert."],"material":[{"h":"Aus dem Prompt · Regeln und Prüfregeln","t":"Regeln: „Nenne in der Rede weder Anteile noch Antipoden. Keine erfundenen Zahlen. Fehlt etwas: [TBD] und eine Rückfrage. Eine Frage pro Runde. Kein Fragenkatalog.“\nPrüfregeln: „Jeder Satz der Rede muss auf eine meiner Angaben zurückführbar sein. Ereignisse, Abstimmungen, Zusagen und Zuständigkeiten, die ich nicht genannt habe, kommen nicht vor.“"},{"h":"Aus dem Prompt · Betrieb","t":"„Lies meine erste Nachricht zuerst. Was dort schon steht, wird nicht erfragt, sondern in einem Halbsatz quittiert – frage nur, was fehlt. Keine erfundenen Fakten: keine Zahlen, Namen, Termine, Zitate, Referenzen, Zusagen oder Ereignisse, die nicht in meinen Angaben stehen. Fehlt etwas, markiere es als [TBD]. Führe die Aufgabe zu Ende; höre nicht auf, um zu fragen, ob du weitermachen sollst. Keine Vorrede, keine Zusammenfassung des Gesprächs, kein Lob.“ Quittieren heißt hier: kurz bestätigen, dass die Angabe angekommen ist."},{"h":"Begriffe einfach erklärt","t":"[TBD] ist ein Platzhalter und steht für „noch zu klären“ (englisch: to be determined). Anteil = innere Stimme eines Zuhörers. Antipode = die Gegenstimme dazu. Fragenkatalog = viele Fragen auf einmal."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Ordne jeden der sechs Fehler der Regel zu, die ihn verhindert.","first":"Lies die Regeln im Material. Nimm eine Karte und frage dich: Welcher Satz des Prompts verbietet genau das?","hint":"Lies die Regeln im Material. Nimm eine Karte und frage dich: Welcher Satz des Prompts verbietet genau das?","success":"Du weißt, wozu jede Regel da ist: „Eine Frage pro Runde“ verhindert den Fragenkatalog, das Erfindungsverbot verhindert unbelegte Zahlen, das Nennverbot hält die Stimmen aus der Rede heraus, und der Abschnitt „Betrieb“ verhindert Abbruch, Lob und doppelte Fragen. Merke: Löschst du eine Regel, kommt ihr Fehler zurück.","model":"Alle Fragen auf einmal: Eine Frage pro Runde. Die 18 Prozent: Nichts erfinden. „Für die Wächter unter euch“: Stimmen nicht nennen. „Soll ich weitermachen?“ und das Lob am Anfang: Zu Ende führen, keine Vorrede. Die doppelte Frage nach der Zeit: Erste Nachricht lesen.","guide":{"why":"Regeln in einem Prompt sind keine Zierde. Jede verhindert einen bestimmten Fehler; wer das weiß, löscht keine Regel aus Versehen.","pre":["[TBD]: Platzhalter für „noch zu klären“.","Fragenkatalog: viele Fragen auf einmal.","Quittieren: kurz bestätigen, dass eine Angabe angekommen ist."],"steps":["Lies die beiden Blöcke im Material: Regeln mit Prüfregeln und Betrieb.","Suche zu jeder Karte den einen Satz, der genau dieses Verhalten verbietet.","Ordne alle sechs Karten zu und klicke Prüfen."],"example":"Im Straßenverkehr verhindert das Stoppschild einen anderen Unfall als die Geschwindigkeitsgrenze. Jede Regel hat ihren eigenen Fehler.","pitfalls":"Abbruch und Lob wirken wie zwei verschiedene Fehler. Beide verbietet derselbe Satz im Abschnitt „Betrieb“: zu Ende führen, keine Vorrede, kein Lob.","criteria":"Zu jeder Karte lässt sich der verbietende Satz wörtlich im Prompt zeigen.","rationale":["Regeln, Prüfregeln und Betrieb nennen jedes der sechs Verhalten ausdrücklich.","Das Erfindungsverbot steht zweimal im Prompt, in den Regeln und im Betrieb; deshalb heißt das Feld nach dem Inhalt der Regel und nicht nach dem Abschnitt."],"goal":""},"trainer":false,"kind":"place","layout":"spalten","formName":"Felder","targets":[{"id":"f1","label":"Eine Frage pro Runde","sub":"kein Fragenkatalog","cap":0},{"id":"f2","label":"Nichts erfinden","sub":"Fehlendes als [TBD] markieren","cap":0},{"id":"f3","label":"Stimmen in der Rede nicht nennen","sub":"","cap":0},{"id":"f4","label":"Zu Ende führen","sub":"keine Vorrede, kein Lob","cap":0},{"id":"f5","label":"Erste Nachricht lesen","sub":"nur fragen, was fehlt","cap":0}],"cards":[{"id":"k1","text":"Die KI stellt alle drei Fragen auf einmal, und Jule übersieht die zweite.","target":"f1","why":"Viele Fragen auf einmal sind ein Fragenkatalog. Die Regel „Eine Frage pro Runde“ verhindert ihn."},{"id":"k4","text":"Die KI hört nach den Stimmen auf und fragt: „Soll ich weitermachen?“","target":"f4","why":"Der Abschnitt „Betrieb“ verlangt, die Aufgabe zu Ende zu führen."},{"id":"k3","text":"Die Rede sagt: „Für die Wächter unter euch habe ich die Regeln mitgebracht.“","target":"f3","why":"Die Stimmen sind ein Werkzeug für die Vorbereitung. In der Rede sollen sie nicht genannt werden."},{"id":"k5","text":"Die Antwort beginnt mit: „Was für eine spannende Aufgabe! Gern helfe ich dir.“","target":"f4","why":"Vorrede und Lob verbietet der Abschnitt „Betrieb“."},{"id":"k6","text":"Jule schreibt gleich zu Beginn: „Ich habe fünf Minuten.“ Die KI fragt trotzdem: „Wie viel Zeit hast du?“","target":"f5","why":"Was schon in der ersten Nachricht steht, soll die KI nicht noch einmal erfragen. So steht es im Abschnitt „Betrieb“."},{"id":"k2","text":"In der Rede steht: „Samstage bringen 18 Prozent mehr Umsatz.“ Die Zahl hat Jule nie genannt.","target":"f2","why":"Die Zahl ist erfunden. Der Prompt verlangt stattdessen [TBD] und eine Rückfrage."}]},{"id":"p08","title":"Den Prompt mit dem Übungsfall ausführen","kicker":"Üben","goal":"Bereite Jules Antworten auf die drei Fragen des Prompts vor, mit denen sie ihn ausführt.","case":["Du hilfst Jule, den Prompt auszuführen. Er wird drei Fragen stellen. Bereite ihre Antworten aus den Notizen vor. Eine Angabe ist nur eine Vermutung; sie gehört unter „Offen“."],"material":[{"h":"Die drei Fragen des Prompts","t":"Frage 1: „Welcher Anlass, welches Ziel, wie viel Zeit?“\nFrage 2: „Wer sitzt da? Anzahl, Rollen, Stimmung – und was wissen sie schon?“\nFrage 3: „Was soll nach der Rede anders sein? Ein Satz reicht.“"},{"h":"Jules Notizen · bestätigt","t":"Teamrunde am Dienstag, 26.01.2027; Jule hat 5 Minuten. Die Geschäftsführung hat am 20.01.2027 entschieden: Ab Samstag, 06.03.2027 ist der Kundenservice auch samstags von 9 bis 13 Uhr erreichbar. Je Samstag arbeiten drei Personen; dafür gibt es einen freien Tag in der Woche danach. Das Team hat 14 Personen, davon fünf in Teilzeit. Die Stimmung ist gereizt, weil der Beschluss per Mail kam. Alle kennen den Beschluss; niemand weiß, wie oft es ihn trifft. Jule will, dass alle bis 09.02.2027 Wünsche für die Verteilung eintragen."},{"h":"Jules Notizen · nicht bestätigt","t":"„Wahrscheinlich ist jede Person einmal im Monat dran.“ Ob Teilzeitkräfte ausgenommen werden, entscheidet die Geschäftsführung noch. Davon hängt ab, wie oft jemand dran ist."},{"baustein":"ausprobieren"},{"baustein":"pruefprotokoll"},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Schreibe Jules Antworten auf die drei Fragen des Prompts und notiere, was offen ist.","first":"Lies zuerst die drei Fragen des Prompts. Trage dann in die Zeile „Anlass:“ ein, wo und wie lange Jule spricht.","hint":"Lies zuerst die drei Fragen des Prompts. Trage dann in die Zeile „Anlass:“ ein, wo und wie lange Jule spricht.","success":"Deine Antworten sind formal vollständig, und du hast die vier Punkte selbst bestätigt. Die Seite bewertet den Inhalt nicht. Nächster Schritt: Folge dem Material „Mit einer echten KI ausprobieren“. Kopiere den Prompt in eine KI und beantworte ihre drei Fragen nacheinander mit deinen Zeilen. Ohne KI-Konto machst du mit der nächsten Übung weiter; dort prüfst du drei Anfänge, die für die Übung geschrieben sind.","model":"Anlass: Teamrunde am 26.01.2027, 5 Minuten. Der Samstagsdienst ab 06.03.2027 ist beschlossen. Ziel: Das Team trägt bis 09.02.2027 Wünsche für die Verteilung ein.\nPublikum: 14 Kolleginnen und Kollegen im Kundenservice, davon fünf in Teilzeit. Die Stimmung ist gereizt, weil der Beschluss per Mail kam. Sie kennen den Beschluss, wissen aber nicht, wie oft es sie trifft.\nDanach: Jede Person weiß, was feststeht, und trägt einen Wunsch für die Verteilung ein.\nOffen: Wie oft jede Person dran ist. Das hängt davon ab, ob Teilzeitkräfte ausgenommen werden; das ist noch nicht entschieden.","guide":{"why":"Der Prompt ist nur so gut wie deine Antworten auf seine drei Fragen. Wer sie vorbereitet, antwortet der KI vollständig und trennt Wissen von Vermutung.","pre":["Bestätigt: Das steht fest und darf als Tatsache genannt werden.","Offen: Das weiß noch niemand; die KI soll dafür [TBD] setzen, also „noch zu klären“."],"steps":["Lies die drei Fragen des Prompts und ordne sie den Zeilen zu: Frage 1 ist „Anlass:“, Frage 2 „Publikum:“, Frage 3 „Danach:“.","Übernimm nur Angaben aus den bestätigten Notizen als Tatsache.","Schreibe die Vermutung zur Häufigkeit unter „Offen:“, bestätige die vier Prüfpunkte und schließe ab."],"example":"Wer einen Handwerker bestellt, sagt: „Bad im ersten Stock, Termin nächste Woche. Ob die Leitung aus Kupfer ist, weiß ich nicht.“ Das Nichtwissen gehört dazu.","pitfalls":"„Einmal im Monat“ klingt harmlos und rutscht leicht in die Zeile „Publikum:“. Dann schreibt die KI eine Zusage in die Rede, die niemand gegeben hat.","criteria":"Jede Zeile beantwortet genau eine Frage des Prompts, und nichts Unbestätigtes steht als Tatsache da.","rationale":["Die drei Zeilen folgen den drei Fragen im Abschnitt „Was du brauchst“.","Die Häufigkeit hängt an der offenen Entscheidung zu den Teilzeitkräften; deshalb steht sie unter „Offen:“."],"goal":""},"trainer":false,"kind":"edit","layout":"freitext","formName":"Freitext","edit":{"fieldLabel":"Jules Antworten für den Prompt","placeholder":"","minLength":220,"required":[{"label":"Anlass","pattern":"^Anlass:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Publikum","pattern":"^Publikum:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Danach","pattern":"^Danach:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Offen","pattern":"^Offen:[ \\t]*\\S[^\\r\\n]*","flags":"im"}],"starter":"Anlass: \nPublikum: \nDanach: \nOffen: ","formatHint":"Beginne jede Zeile mit einer dieser Überschriften und Doppelpunkt: Anlass:, Publikum:, Danach:, Offen:. Schreibe deinen eigenen Text direkt dahinter. Keine Nummer vor die Überschrift setzen.","prompts":[{"label":"Anlass","question":"Wo spricht Jule, wie lange, und was will sie erreichen?"},{"label":"Publikum","question":"Wie viele hören zu, wie ist die Stimmung, was wissen sie schon?"},{"label":"Danach","question":"Welcher eine Satz soll danach für das Team gelten?"},{"label":"Offen","question":"Welche Angabe ist nur eine Vermutung und darf nicht als Tatsache stehen?"}],"checks":["Unter „Anlass:“ stehen Teamrunde, 5 Minuten und Jules Ziel.","Unter „Publikum:“ stehen Anzahl, Stimmung und Vorwissen des Teams.","Unter „Danach:“ steht genau ein Satz.","„Einmal im Monat“ steht nur unter „Offen:“ und nirgends als Tatsache."]}},{"id":"p09","title":"Hält die Ausgabe, was der Prompt verlangt?","kicker":"Ausgabe prüfen","goal":"Prüfe drei Redeanfänge der KI an den Regeln des Prompts.","case":["Jule hat den Prompt dreimal laufen lassen und drei verschiedene Redeanfänge bekommen. Nur einer hält die Regeln des Prompts ein. Jule hat der KI gesagt: Die Stimmung ist gereizt, weil der Beschluss per Mail kam. Bestätigt sind: Samstagsdienst ab 6. März, 9 bis 13 Uhr, drei Personen je Samstag, ein freier Tag in der Woche danach. Nicht bestätigt ist, wie oft jede Person dran ist."],"material":[{"h":"Aus dem Prompt · Regeln","t":"„Nenne in der Rede weder Anteile noch Antipoden. Keine erfundenen Zahlen. Fehlt etwas: [TBD] und eine Rückfrage.“ Die Prüfregeln ergänzen: „Jeder Satz der Rede muss auf eine meiner Angaben zurückführbar sein.“ Zur Rede heißt es außerdem: „Kein Pathos, keine Floskeln, keine Aufzählung von Argumenten.“"},{"h":"Begriffe einfach erklärt","t":"[TBD] steht für „noch zu klären“. Anteile sind die inneren Stimmen der Zuhörer, zum Beispiel Betroffene oder Wächter. Pathos = übertrieben feierlicher Ton."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Wähle den Anfang, der den Prompt einhält, und markiere genau zwei echte Mängel der anderen.","first":"Lies die Regeln im Material. Prüfe dann jeden Anfang Satz für Satz gegen Jules bestätigte Angaben.","hint":"Lies die Regeln im Material. Prüfe dann jeden Anfang Satz für Satz gegen Jules bestätigte Angaben.","success":"Du kannst eine Ausgabe an den Regeln des Prompts prüfen. Anfang B hält sie ein: Er nennt nur Bestätigtes und kennzeichnet das Offene mit [TBD]. Anfang A erfindet eine Zahl, Anfang C nennt die Stimmen beim Namen. Offenes zu benennen ist kein Mangel.","model":"Anfang B. Echte Mängel der anderen: A nennt eine erfundene Zahl, C nennt die Stimmen beim Namen.","guide":{"why":"Auch ein guter Prompt wird nicht immer befolgt. Wer die Ausgabe an den Regeln misst, merkt Fehler, bevor sie vor Publikum landen.","pre":["[TBD]: Platzhalter für „noch zu klären“.","Anteil: innere Stimme eines Zuhörers, zum Beispiel Betroffene oder Wächter."],"steps":["Lies die Regeln und merke dir drei Prüffragen: Wird eine Stimme genannt? Ist eine Zahl erfunden? Ist Fehlendes mit [TBD] markiert?","Gehe jeden Anfang mit diesen drei Fragen durch und vergleiche Zahlen mit den bestätigten Angaben in der Lage.","Wähle einen Anfang, markiere zwei Mängel und klicke Prüfen."],"example":"Ein Kassenbon ist nicht deshalb falsch, weil ein Posten als „noch offen“ markiert ist. Falsch ist er, wenn ein Betrag draufsteht, den es nie gab.","pitfalls":"Ein [TBD] in der Rede wirkt unfertig und verleitet dazu, es als Mangel zu markieren. Der Prompt verlangt es ausdrücklich.","criteria":"Der gewählte Anfang enthält nur bestätigte Angaben, nennt keine Stimme und markiert das Fehlende.","rationale":["Alle Angaben in Anfang B stehen in Jules bestätigten Notizen.","Die 18 Prozent und die genannten Stimmen verstoßen jeweils gegen einen Satz der Regeln."],"goal":""},"trainer":false,"kind":"compare","layout":"vergleich","formName":"Vergleich","drafts":[{"id":"d1","label":"Anfang A","text":"„Unsere Kundinnen und Kunden schreiben uns am Wochenende. Samstage bringen uns 18 Prozent mehr Umsatz. Für den Samstagsdienst gibt es drei gute Gründe: Erstens …“","why":"Anfang A nennt eine Zahl, die Jule nie angegeben hat, und beginnt eine Aufzählung von Argumenten.","best":false,"img":""},{"id":"d2","label":"Anfang B","text":"„Der Samstag steht fest, und ihr habt es per Mail erfahren. Ich weiß, dass das viele geärgert hat. Fest steht: ab 6. März, 9 bis 13 Uhr, drei von uns, dazu ein freier Tag in der Woche danach. Wie oft es jede und jeden trifft: [TBD].“","why":"","best":true,"img":""},{"id":"d3","label":"Anfang C","text":"„Ich weiß, dass hier Betroffene sitzen und auch ein paar Wächter. Für die Betroffenen zuerst: Ihr bekommt einen freien Tag in der Woche danach. Für die Wächter: Die Regeln kommen schriftlich.“","why":"Anfang C nennt die Stimmen beim Namen. Das verbietet der Prompt.","best":false,"img":""}],"best":"d2","flaws":[{"id":"m1","label":"A: erfundene Zahl","text":"„18 Prozent mehr Umsatz“ steht in keiner Angabe von Jule.","ok":true,"why":"Der Prompt verbietet erfundene Zahlen und verlangt stattdessen [TBD]."},{"id":"m2","label":"B: lässt etwas offen","text":"Die Rede sagt nicht, wie oft es jede Person trifft, und setzt [TBD].","ok":false,"why":"Das ist kein Mangel. Genau so verlangt es die Regel, wenn eine Angabe fehlt."},{"id":"m3","label":"C: nennt die Stimmen","text":"„Betroffene“ und „Wächter“ werden in der Rede beim Namen genannt.","ok":true,"why":"Die Regel lautet: Nenne in der Rede weder Anteile noch Antipoden."},{"id":"m4","label":"B: nennt keine Gründe","text":"Die Rede erklärt nicht, warum der Samstagsdienst eingeführt wird.","ok":false,"why":"Das ist kein Mangel. Der Prompt will keine Aufzählung von Argumenten, und das Team bezweifelt den Beschluss nicht."}]},{"id":"p10","title":"Der Prompt für meinen eigenen Fall","kicker":"Eigener Fall","goal":"Bereite den Prompt für einen eigenen Anlass vor und lege fest, woran du die Ausgabe prüfst.","case":["Jetzt geht es um dich: Wähle einen Anlass, bei dem du bald vor Menschen sprichst. Hast du keinen, nimm diesen: Du stellst in deinem Verein eine neue Regel für die Nutzung des Vereinsraums vor. Schreibe keine echten Namen und nichts Vertrauliches auf."],"material":[{"h":"Das Raster einfach erklärt","t":"Anlass: wo du sprichst, wie lange und mit welchem Ziel.\nPublikum: wie viele zuhören, in welcher Rolle und Stimmung, und was sie schon wissen.\nDanach: ein Satz, der nach deiner Ansprache gelten soll.\nPrüfung: woran du die Ausgabe der KI misst, zum Beispiel an den Regeln des Prompts.\nOffen: was du nicht weißt und die KI deshalb nicht erfinden darf."},{"h":"Die Regeln des Prompts als Prüfliste","t":"Die Rede nennt keine Anteile und keine Antipoden. Jeder Satz geht auf deine Angaben zurück: keine erfundenen Zahlen, Namen, Termine oder Zusagen; Fehlendes ist mit [TBD] markiert. Die KI stellt eine Frage pro Runde. [TBD] steht für „noch zu klären“. Anteile sind die inneren Stimmen der Zuhörer, Antipoden ihre Gegenstimmen."},{"baustein":"ausprobieren"},{"baustein":"pruefprotokoll"},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Schreibe deine Eingaben und deinen Prüfplan für einen eigenen Anlass.","first":"Trage in die Zeile „Anlass:“ ein, wo du sprichst, wie lange und mit welchem Ziel.","hint":"Trage in die Zeile „Anlass:“ ein, wo du sprichst, wie lange und mit welchem Ziel.","success":"Dein Fall ist formal vollständig, und du hast die fünf Punkte selbst bestätigt. Die Seite bewertet den Inhalt nicht; ob dein Bild vom Publikum stimmt, zeigt erst die Wirklichkeit. Nächster Schritt: Folge dem Material „Mit einer echten KI ausprobieren“. Kopiere den Prompt in eine KI und beantworte ihre drei Fragen mit deinen Zeilen. Prüfe die Ausgabe mit deinem Prüfplan.","model":"Anlass: Mitgliederversammlung meines Sportvereins, ich habe vier Minuten. Ziel: Die neue Regel für den Vereinsraum wird ohne Streit angenommen.\nPublikum: Etwa 40 Mitglieder, viele seit Jahren dabei. Einige nutzen den Raum jede Woche und fürchten Einschränkungen. Sie wissen, dass es Ärger um die Belegung gab, kennen die neue Regel aber noch nicht.\nDanach: Jedes Mitglied weiß, wie es den Raum bucht, und hält die Regel für fair.\nPrüfung: Die Rede nennt keine Stimmen beim Namen, enthält keine erfundenen Zahlen und markiert Fehlendes mit [TBD].\nOffen: Ob der Vorstand Ausnahmen für die Jugendgruppen erlaubt, ist noch nicht entschieden.","guide":{"why":"Erst am eigenen Fall zeigt sich, ob du den Prompt verstanden hast. Mit vorbereiteten Eingaben und einem Prüfplan nutzt du ihn, statt ihm zu glauben.","pre":["Prüfplan: die Punkte, an denen du die Ausgabe der KI misst.","[TBD]: Platzhalter für „noch zu klären“."],"steps":["Wähle einen Anlass und trage in „Anlass:“ Ort, Zeit und Ziel ein.","Beschreibe unter „Publikum:“ Menschen, nicht Zahlen: Rolle, Stimmung, Vorwissen.","Lege unter „Prüfung:“ mindestens eine Regel des Prompts fest und notiere unter „Offen:“, was du nicht weißt."],"example":"Wer ein Auto zur Probe fährt, weiß vorher, worauf er achtet: Bremsen, Sicht, Platz. Ohne diese Liste bleibt nur ein gutes Gefühl.","pitfalls":"Unter „Publikum:“ steht oft nur „20 Leute aus dem Vertrieb“. Damit kann die KI keine Stimmen ableiten; ihr fehlen Stimmung und Vorwissen.","criteria":"Eine fremde Person könnte mit deinen fünf Zeilen den Prompt für dich ausführen und die Ausgabe prüfen.","rationale":["Die ersten drei Zeilen sind die drei Fragen des Prompts.","Prüfung und Offenes kommen aus den Regeln: Ausgabe messen und nichts erfinden lassen."],"goal":""},"trainer":false,"kind":"edit","layout":"freitext","formName":"Freitext","edit":{"fieldLabel":"Mein Fall für den Prompt","placeholder":"","minLength":240,"required":[{"label":"Anlass","pattern":"^Anlass:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Publikum","pattern":"^Publikum:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Danach","pattern":"^Danach:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Prüfung","pattern":"^Prüfung:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Offen","pattern":"^Offen:[ \\t]*\\S[^\\r\\n]*","flags":"im"}],"starter":"Anlass: \nPublikum: \nDanach: \nPrüfung: \nOffen: ","formatHint":"Beginne jede Zeile mit einer dieser Überschriften und Doppelpunkt: Anlass:, Publikum:, Danach:, Prüfung:, Offen:. Schreibe deinen eigenen Text direkt dahinter. Keine Nummer vor die Überschrift setzen.","prompts":[{"label":"Anlass","question":"Wo sprichst du, wie lange, und was willst du erreichen?"},{"label":"Publikum","question":"Wer hört zu, in welcher Stimmung, und was wissen sie schon?"},{"label":"Danach","question":"Welcher eine Satz soll danach gelten?"},{"label":"Prüfung","question":"An welcher Regel des Prompts misst du die Ausgabe?"},{"label":"Offen","question":"Was weißt du nicht, sodass die KI es nicht erfinden darf?"}],"checks":["Unter „Publikum:“ stehen Rollen, Stimmung und Vorwissen, nicht nur eine Zahl.","Unter „Danach:“ steht ein einziger Satz.","Unter „Prüfung:“ steht mindestens eine Regel des Prompts, an der ich die Ausgabe messe.","Unter „Offen:“ steht mindestens eine Angabe, die ich nicht weiß.","Mein Text enthält keine echten Namen und nichts Vertrauliches."]}},{"id":"p11","title":"Wie bin ich mit dem Prompt klargekommen?","kicker":"Rückblick","goal":"Werte deinen Lauf aus: Durchführung, Design und Aufbau des Prompts, und wo du ihn einsetzt und wo nicht.","case":["Du hast den Prompt mit einer echten KI ausgeführt, mit dem Übungsfall oder mit deinem eigenen Fall. Ohne KI-Konto prüfst du zuerst die Beispielausgabe im Material dieser Übung mit den Punkten 2 bis 7 des Prüfprotokolls. Halte jetzt fest, wie es gelaufen ist und was du daraus mitnimmst. Dein Rückblick ist zugleich eine Rückmeldung für deine Trainerin oder deinen Trainer."],"material":[{"h":"Fünf Blickwinkel für deinen Rückblick","t":"Durchführung: Wie lief der Lauf? Hat die KI einzeln gefragt, hat sie etwas erfunden, wo musstest du nachhaken?\nDesign: Wie ist der Prompt gedacht? Dazu gehören die Idee, erst das Publikum zu klären, das Bild der inneren Stimmen und die Regel, nichts zu erfinden. Was davon hat dir geholfen, was hat gestört?\nAufbau: Wie ist der Prompt gebaut? Dazu gehören seine neun Abschnitte und ihre Reihenfolge. Welcher Abschnitt hat am meisten bewirkt, welcher blieb dir unklar?\nEinsetzen: Für welchen Anlass in deiner Arbeit nimmst du den Prompt?\nNicht einsetzen: Wofür nimmst du ihn nicht, und warum?"},{"h":"Zur Erinnerung · wofür der Prompt gebaut ist","t":"Er liefert eine kurze, gesprochene Ansprache für mehrere Zuhörer in einem Raum: 350 bis 400 Wörter. Er braucht Anlass, Zuhörer und die gewünschte Veränderung. Für geschriebene Texte, Gespräche zu zweit und lange Vorträge ist er nicht gebaut. Die neun Abschnitte heißen ROLLE, WAS DU BRAUCHST, DAS MODELL, ABLAUF, BEISPIEL, REGELN, PRÜFREGELN, BETRIEB und START."},{"baustein":"beispielausgabe"},{"baustein":"pruefprotokoll"},{"baustein":"ausprobieren"},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Schreibe deinen Rückblick in fünf Zeilen.","first":"Trage in die Zeile „Durchführung:“ ein, was beim Ausführen gut lief und wo es hakte.","hint":"Trage in die Zeile „Durchführung:“ ein, was beim Ausführen gut lief und wo es hakte.","success":"Dein Rückblick ist formal vollständig, und du hast die fünf Punkte selbst bestätigt. Die Seite bewertet den Inhalt nicht. Der Rückblick steht im Abschluss dieses Lernwegs; mit „Abschluss kopieren“ kannst du ihn als Rückmeldung an deine Trainerin oder deinen Trainer weitergeben.","model":"Durchführung: Die KI hat ihre Fragen einzeln gestellt. Bei der Rede musste ich einmal nachhaken, weil ein Termin vorkam, den ich nicht genannt hatte.\nDesign: Geholfen hat mir, dass zuerst die Zuhörer beschrieben werden; zwei Stimmen hatte ich vorher nicht bedacht. Gestört hat mich das Wort Antipode.\nAufbau: Am meisten bewirkt haben die drei Fragen im Abschnitt WAS DU BRAUCHST. Der Abschnitt BEISPIEL war mir zu knapp.\nEinsetzen: Für die Ansprache in der Teamrunde, wenn ich eine Änderung im Dienstplan erkläre.\nNicht einsetzen: Für die Rundmail an alle Standorte, weil sie gelesen und nicht gehört wird.","guide":{"why":"Ein Prompt ist erst dann dein Werkzeug, wenn du weißt, wie du mit ihm zurechtkommst und wofür du ihn nimmst. Der Rückblick macht aus einem Probelauf eine Entscheidung für den Alltag.","pre":["Design: wie der Prompt gedacht ist, zum Beispiel erst das Publikum, dann der Text.","Aufbau: wie der Prompt gebaut ist, also seine Abschnitte und ihre Reihenfolge."],"steps":["Halte unter „Durchführung:“ eine Beobachtung aus deinem Lauf fest: was gut lief und wo du nachhaken musstest.","Trenne Design und Aufbau: erst der Gedanke, der geholfen oder gestört hat, dann der Abschnitt, der am meisten bewirkt hat.","Nenne je einen Anlass aus deiner Arbeit, für den du den Prompt nimmst und für den du ihn nicht nimmst, mit Grund."],"example":"Nach einer Probefahrt sagt man nicht nur „fährt gut“. Man sagt: Die Sitze passen, der Kofferraum ist zu klein, für die Stadt ja, für den Umzug nein.","pitfalls":"Design und Aufbau werden leicht vermischt. Design ist die Idee, Aufbau sind die Abschnitte. Ein Prompt kann gut gedacht und trotzdem umständlich gebaut sein.","criteria":"Jede Zeile enthält etwas, das nur du nach deinem Lauf sagen kannst, und die beiden letzten Zeilen nennen echte Anlässe aus deiner Arbeit.","rationale":["Die fünf Zeilen decken ab, was für den Alltag zählt: wie es lief, warum es so lief und wofür es sich lohnt.","Wo der Prompt nicht passt, folgt aus dem, wofür er gebaut ist: kurz, gesprochen, mehrere Zuhörer."],"goal":""},"trainer":false,"kind":"edit","layout":"freitext","formName":"Freitext","edit":{"fieldLabel":"Mein Rückblick auf den Prompt","placeholder":"","minLength":240,"required":[{"label":"Durchführung","pattern":"^Durchführung:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Design","pattern":"^Design:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Aufbau","pattern":"^Aufbau:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Einsetzen","pattern":"^Einsetzen:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Nicht einsetzen","pattern":"^Nicht einsetzen:[ \\t]*\\S[^\\r\\n]*","flags":"im"}],"starter":"Durchführung: \nDesign: \nAufbau: \nEinsetzen: \nNicht einsetzen: ","formatHint":"Beginne jede Zeile mit einer dieser Überschriften und Doppelpunkt: Durchführung:, Design:, Aufbau:, Einsetzen:, Nicht einsetzen:. Schreibe deinen eigenen Text direkt dahinter. Keine Nummer vor die Überschrift setzen.","prompts":[{"label":"Durchführung","question":"Was lief beim Ausführen gut, wo hakte es?"},{"label":"Design","question":"Welcher Gedanke des Prompts hat dir geholfen, welcher hat gestört?"},{"label":"Aufbau","question":"Welcher Abschnitt hat am meisten bewirkt, welcher blieb unklar?"},{"label":"Einsetzen","question":"Für welchen Anlass in deiner Arbeit nimmst du ihn?"},{"label":"Nicht einsetzen","question":"Wofür nimmst du ihn nicht, und warum?"}],"checks":["Unter „Durchführung:“ steht eine Beobachtung aus meinem Lauf, nicht nur „lief gut“.","Unter „Design:“ nenne ich mindestens einen Gedanken des Prompts, der geholfen oder gestört hat.","Unter „Aufbau:“ nenne ich mindestens einen Abschnitt beim Namen.","Unter „Einsetzen:“ steht ein Anlass aus meiner eigenen Arbeit.","Unter „Nicht einsetzen:“ steht ein Anlass mit Begründung."]}},{"id":"t01","title":"Nur ein Redenschreiber?","kicker":"Die eine Idee","goal":"Zeige der Gruppe, was der Prompt schon vor der Rede liefert.","case":["Deniz Aksoy ist Projektleiter im Ingenieurbüro Lotwerk. Er muss den Lenkungskreis um sechs Wochen mehr Zeit bitten. Der Lenkungskreis ist die Runde der Entscheider über ein Projekt. Ein Kollege winkt ab: „Dieser Prompt ist doch nur ein Redenschreiber.“"],"material":[{"h":"Was Deniz beim Probelauf bekam","t":"Vor der Rede lieferte die KI eine Liste: sechs innere Stimmen der Entscheider, jede mit dem, was sie will und fürchtet. Darunter stand, welche zwei Stimmen über die Zustimmung entscheiden. Deniz sagt: „Die Liste allein hat mir gezeigt, womit ich anfangen muss. Die Rede habe ich danach selbst umgeschrieben.“"},{"h":"Aus dem Prompt · erster Abschnitt","t":"„Du hilfst mir, eine Rede zu bauen, die zu einem konkreten Publikum passt. Nicht der Text steht am Anfang, sondern das Publikum.“ Innere Stimme = ein Wunsch oder eine Sorge eines Zuhörers."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Welche Antwort an den Kollegen trifft den Unterschied?","first":"Lies, was Deniz mit der Liste der Stimmen gemacht hat. Wähle dann die Antwort an den Kollegen.","hint":"Lies, was Deniz mit der Liste der Stimmen gemacht hat. Wähle dann die Antwort an den Kollegen.","success":"Die Gruppe sieht: Der Prompt liefert zwei Dinge, ein Bild vom Publikum und eine Rede. Das Bild vom Publikum ist auch ohne die Rede brauchbar. Wer nur die Rede erwartet, übersieht die Hälfte.","model":"Er liefert vor der Rede eine Analyse der Zuhörer. Deniz hat sie genutzt und die Rede selbst umgeschrieben.","guide":{"why":"Die Gruppe soll erkennen, dass das Bild vom Publikum ein eigenes Ergebnis ist. Das nimmt die Sorge, die KI schreibe einem die Rede vor.","pre":["Lenkungskreis: die Runde der Entscheider über ein Projekt.","Innere Stimme: ein Wunsch oder eine Sorge eines Zuhörers."],"steps":["Lies den Einwand des Kollegen vor und lass die Gruppe zuerst selbst antworten.","Lass die Gruppe im Material suchen, was Deniz vor der Rede bekam.","Wähle bewusst zuerst „Er kennt die Entscheider“ und besprecht die Rückmeldung."],"example":"Ein Reiseführer nützt auch dem, der die Reise am Ende selbst plant.","pitfalls":"Die Gruppe hält die KI leicht für allwissend. Der Prompt fragt gerade deshalb, weil sie das Publikum nicht kennt.","criteria":"Die Antwort benennt, was der Prompt vor der Rede liefert.","rationale":["Deniz hat die Liste der Stimmen eigenständig genutzt.","Der erste Abschnitt des Prompts stellt das Publikum vor den Text."],"goal":""},"trainer":true,"kind":"choice","layout":"auswahl","formName":"Einzelauswahl","multi":false,"options":[{"id":"o1","label":"Er liefert eine Analyse","text":"Vor der Rede beschreibt er die Zuhörer; diese Liste ist schon für sich brauchbar.","ok":true,"why":"Deniz hat die Liste der Stimmen genutzt und die Rede selbst umgeschrieben. Das Bild vom Publikum ist ein eigenes Ergebnis."},{"id":"o2","label":"Er schreibt schönere Sätze","text":"Seine Reden klingen gewandter als die eines gewöhnlichen Auftrags an die KI.","ok":false,"why":"Über schöne Sätze sagt der Prompt nichts. Er verlangt gesprochene Sprache ohne Pathos; der Unterschied liegt vor dem Schreiben."},{"id":"o3","label":"Er kennt die Entscheider","text":"Er weiß von selbst, wie ein Lenkungskreis denkt, und braucht keine Angaben.","ok":false,"why":"Die KI kennt den Lenkungskreis von Lotwerk nicht. Darum stellt der Prompt zuerst drei Fragen."}]},{"id":"t02","title":"Lohnt sich der Umweg?","kicker":"Der Nutzen","goal":"Mache am Gegenbeispiel sichtbar, was ohne die drei Fragen verloren geht.","case":["Deniz hat nur zehn Minuten im Lenkungskreis und wenig Zeit zur Vorbereitung. Er überlegt, die drei Fragen des Prompts zu überspringen und gleich um die Rede zu bitten."],"material":[{"h":"Deniz’ Annahme und die Vorgespräche","t":"Deniz nimmt an: „Die Entscheider wollen jedes technische Detail des Bodengutachtens hören.“ In vier von sechs Vorgesprächen kam aber dieselbe Frage: „Woher kommen die sechs Wochen?“ Niemand fragte nach technischen Einzelheiten."},{"h":"So steht es im Briefing zum Prompt","t":"„Der teuerste Fehler bei Reden ist nicht der Inhalt, sondern die Annahme über das Publikum. Der Prompt macht diese Annahme sichtbar, bevor sie teuer wird.“ Annahme = etwas, das man für wahr hält, ohne es geprüft zu haben."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Was verliert Deniz, wenn er die drei Fragen überspringt?","first":"Vergleiche Deniz’ Annahme mit den Vorgesprächen. Wähle dann, was ohne die drei Fragen verloren geht.","hint":"Vergleiche Deniz’ Annahme mit den Vorgesprächen. Wähle dann, was ohne die drei Fragen verloren geht.","success":"Die Gruppe sieht den Nutzen am Gegenbeispiel: Ohne die drei Fragen bleibt Deniz’ Annahme ungeprüft, und die Rede beantwortet die falsche Frage. Der Umweg kostet Minuten und spart eine verlorene Sitzung.","model":"Deniz verliert die Prüfung seiner Annahme. Die Entscheider fragen nach den sechs Wochen, nicht nach technischen Einzelheiten.","guide":{"why":"Zeitdruck ist der häufigste Grund, die Fragen zu überspringen. Die Gruppe soll sehen, dass gerade dann eine falsche Annahme teuer wird.","pre":["Annahme: etwas, das man für wahr hält, ohne es geprüft zu haben.","Vorgespräch: ein kurzes Gespräch mit einem Entscheider vor der Sitzung."],"steps":["Lass die Gruppe Deniz’ Annahme in eigenen Worten wiederholen.","Frage: Was haben die Entscheider in den Vorgesprächen tatsächlich gefragt?","Führe zuerst „Nur etwas Höflichkeit“ vor und besprecht, wozu die Antworten gebraucht werden."],"example":"Wer ohne Nachfrage für Gäste kocht, merkt erst am Tisch, dass zwei kein Fleisch essen.","pitfalls":"Die Länge der Rede wirkt wie eine Angabe, die man der KI sagen muss. Sie steht aber fest im Prompt.","criteria":"Die Antwort verbindet die übersprungenen Fragen mit der ungeprüften Annahme.","rationale":["Vier von sechs Vorgesprächen widersprechen Deniz’ Annahme.","Das Briefing nennt genau diesen Fehler als den teuersten."],"goal":""},"trainer":true,"kind":"choice","layout":"auswahl","formName":"Einzelauswahl","multi":false,"options":[{"id":"o1","label":"Nur etwas Höflichkeit","text":"Die Fragen sind eine freundliche Einleitung; die Rede wird ohne sie genauso gut.","ok":false,"why":"Die Fragen sind keine Höflichkeit. Aus den Antworten leitet die KI die Stimmen der Entscheider ab."},{"id":"o2","label":"Die Prüfung seiner Annahme","text":"Die KI schreibt dann für Zuhörer, die Details wollen, obwohl sie etwas anderes fragen.","ok":true,"why":"Deniz’ Annahme passt nicht zu den Vorgesprächen. Erst die Frage nach den Zuhörern bringt das ans Licht."},{"id":"o3","label":"Die richtige Länge","text":"Die KI weiß dann nicht mehr, dass die Rede 350 bis 400 Wörter haben soll.","ok":false,"why":"Die Länge steht fest im Prompt und hängt nicht von den drei Fragen ab."}]},{"id":"t03","title":"Wo passt der Prompt nicht?","kicker":"Einsatzfälle","goal":"Lass die Gruppe die Grenze des Prompts an vier Vorhaben finden.","case":["Im Ingenieurbüro Lotwerk hat sich der Prompt herumgesprochen. Vier Kolleginnen und Kollegen wollen ihn nutzen. Deniz soll sagen, wo er nicht passt."],"material":[{"h":"Was der Prompt braucht und liefert","t":"Er braucht drei Angaben: Anlass mit Ziel und Zeit; wer zuhört; was danach anders sein soll. Er liefert die Stimmen der Zuhörer und eine Ansprache von 350 bis 400 Wörtern in gesprochener Sprache."},{"h":"Vier Vorhaben bei Lotwerk","t":"Vorhaben 1: Die Bauleiterin erklärt Anwohnern bei einem Infoabend eine Straßensperrung.\nVorhaben 2: Der Controller will eine Kostenaufstellung nachrechnen lassen.\nVorhaben 3: Die Personalleiterin begrüßt acht neue Auszubildende am ersten Tag.\nVorhaben 4: Ein Statiker braucht die Zusammenfassung einer Norm mit 60 Seiten."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Für welche zwei Vorhaben ist dieser Prompt nicht gebaut?","first":"Lies, was der Prompt braucht und liefert. Suche dann die Vorhaben, bei denen niemand zuhört.","hint":"Lies, was der Prompt braucht und liefert. Suche dann die Vorhaben, bei denen niemand zuhört.","success":"Die Gruppe kennt die Grenze: Der Prompt ist für Ansprachen gebaut. Nachrechnen und Zusammenfassen haben keine Zuhörer; dafür ist er das falsche Werkzeug. Infoabend und Begrüßung passen.","model":"Vorhaben 2 und Vorhaben 4: Beim Nachrechnen und beim Zusammenfassen hört niemand zu.","guide":{"why":"Wer die Grenze eines Prompts kennt, vertraut ihm an der richtigen Stelle. Die Gruppe lernt, nach dem Publikum zu fragen, bevor sie einen Prompt wählt.","pre":["Norm: ein verbindliches technisches Regelwerk.","Ansprache: ein gesprochener Text vor Zuhörern."],"steps":["Lass die Gruppe zu jedem Vorhaben sagen, wer zuhört.","Frage bei Vorhaben 2 und 4: Welche Antwort gäbe es auf „Wer sitzt da?“","Führe vor, was die Rückmeldung sagt, wenn nur ein Vorhaben gewählt ist."],"example":"Eine Wasserwaage zeigt, ob etwas gerade ist. Die Länge misst sie nicht.","pitfalls":"Die Frage ist hier umgekehrt gestellt: Gesucht ist, wo der Prompt nicht passt.","criteria":"Beide gewählten Vorhaben haben keine Zuhörer.","rationale":["Ohne Zuhörer bleiben alle drei Fragen des Prompts leer.","Infoabend und Begrüßung haben ein Publikum, ein Ziel und eine gewünschte Veränderung."],"goal":""},"trainer":true,"kind":"choice","layout":"mehrfach","formName":"Mehrfachauswahl","multi":true,"options":[{"id":"o1","label":"Vorhaben 1","text":"Infoabend für Anwohner zur Straßensperrung.","ok":false,"why":"Hier passt der Prompt: Anwohner sind Zuhörer mit Sorgen, und der Abend hat ein Ziel."},{"id":"o2","label":"Vorhaben 2","text":"Kostenaufstellung nachrechnen lassen.","ok":true,"why":"Nachrechnen ist eine Prüfaufgabe ohne Zuhörer. Die drei Fragen des Prompts hätten keine Antwort."},{"id":"o3","label":"Vorhaben 3","text":"Begrüßung von acht neuen Auszubildenden.","ok":false,"why":"Hier passt der Prompt: Die Auszubildenden sind ein Publikum mit Erwartungen und Befürchtungen."},{"id":"o4","label":"Vorhaben 4","text":"Zusammenfassung einer Norm mit 60 Seiten.","ok":true,"why":"Eine Zusammenfassung hat keinen Raum voller Zuhörer. Dafür braucht es einen anderen Prompt."}]},{"id":"t04","title":"Pflicht, Kür oder Ergebnis?","kicker":"Eingabe und Ausgabe","goal":"Zeige, dass der Prompt neben Pflichtangaben auch eine freiwillige Eingabe kennt.","case":["Deniz bereitet seinen Lauf vor. Neben seinen Antworten hat er das Bodengutachten als PDF. Die Gruppe soll sortieren, was der Prompt verlangt, was Deniz zusätzlich mitgeben kann und was er zurückbekommt."],"material":[{"h":"Aus dem Briefing · Was hereinkommt","t":"„Anlass, Ziel und Zeitrahmen der Rede. Wer im Raum sitzt: Rollen, Stimmung, Vorwissen. Was nach der Rede anders sein soll – ein Satz. Optional: ein PDF mit Zahlen, Zitaten oder Vorgaben.“ Optional heißt: freiwillig, nicht nötig."},{"h":"Aus dem Prompt · Was herauskommt","t":"Schritt 2: „Welche zwei Anteile entscheiden über Erfolg oder Misserfolg?“ Schritt 4: eine Tabelle und „zwei Sätze: Wo ist die Rede angreifbar?“ Anteil = innere Stimme eines Zuhörers. Angreifbar ist eine Stelle, an der Zuhörer widersprechen könnten."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Ordne fünf Karten zu: Pflichtangabe, freiwillige Eingabe oder Ergebnis?","first":"Lies im Material, welche Eingabe mit „Optional“ beginnt. Nimm dann die Karte mit dem Gutachten.","hint":"Lies im Material, welche Eingabe mit „Optional“ beginnt. Nimm dann die Karte mit dem Gutachten.","success":"Die Gruppe kennt drei Arten von Bausteinen: Pflichtangaben, nach denen der Prompt fragt, eine freiwillige Eingabe wie das PDF und die Ergebnisse. Das Gutachten macht die Rede genauer, nötig ist es nicht.","model":"Pflicht: Anlass mit Ziel und Zeit; die sechs Entscheider. Freiwillig: das Bodengutachten als PDF. Ergebnis: die zwei entscheidenden Stimmen; die angreifbare Stelle.","guide":{"why":"Viele glauben, ein Prompt brauche möglichst viel Material. Die Gruppe sieht: Drei Antworten genügen, alles Weitere ist Kür.","pre":["Optional: freiwillig, nicht nötig.","Bodengutachten: der Bericht über den Baugrund, hier der Grund für die Verschiebung."],"steps":["Lass die Gruppe im Material das Wort „Optional“ suchen.","Frage bei jeder Karte: Fragt der Prompt danach, darf ich es dazugeben, oder kommt es zurück?","Lege das Gutachten bewusst zuerst zu „Pflichtangabe“ und besprecht die Rückmeldung."],"example":"Für eine Bahnfahrkarte braucht man Start, Ziel und Tag. Der Sitzplatzwunsch ist freiwillig.","pitfalls":"Das Gutachten ist für Deniz’ Bitte entscheidend und wirkt deshalb wie eine Pflicht. Für den Prompt bleibt es freiwillig.","criteria":"Das PDF liegt bei der freiwilligen Eingabe, nicht bei der Pflicht.","rationale":["Das Briefing kennzeichnet nur das PDF als optional.","Schritt 2 und Schritt 4 nennen die beiden Ergebnisse wörtlich."],"goal":""},"trainer":true,"kind":"place","layout":"spalten","formName":"Felder","targets":[{"id":"f1","label":"Pflichtangabe","sub":"danach fragt der Prompt","cap":0},{"id":"f2","label":"Freiwillige Eingabe","sub":"kann ich mitgeben","cap":0},{"id":"f3","label":"Ergebnis","sub":"liefert der Prompt","cap":0}],"cards":[{"id":"k5","text":"Zwei Sätze dazu, wo die Rede angreifbar ist","target":"f3","why":"Die angreifbare Stelle nennt der Prompt in Schritt 4."},{"id":"k2","text":"Sechs Entscheider, knapp und genervt; sie kennen das Gutachten nicht","target":"f1","why":"Wer im Raum sitzt, erfragt der Prompt mit seiner zweiten Frage."},{"id":"k4","text":"Welche zwei Stimmen über die Zustimmung entscheiden","target":"f3","why":"Das liefert der Prompt in Schritt 2."},{"id":"k3","text":"Das Bodengutachten vom 22.01.2027 als PDF","target":"f2","why":"Ein PDF mit Zahlen oder Vorgaben ist laut Briefing freiwillig."},{"id":"k1","text":"Lenkungskreis am 04.02.2027, zehn Minuten, Ziel: Zustimmung zur Verschiebung","target":"f1","why":"Anlass, Ziel und Zeit erfragt der Prompt mit seiner ersten Frage."}]},{"id":"t05","title":"Welche Frage kommt als Nächstes?","kicker":"Ablauf","goal":"Lass die Gruppe vorhersagen, in welcher Folge die KI fragt.","case":["Deniz startet den Prompt vor der Gruppe. Die KI stellt ihre Fragen einzeln. Die Gruppe soll vorhersagen, was als Nächstes kommt."],"material":[{"h":"Aus dem Prompt · Was du brauchst und Start","t":"„Frage mich nacheinander – immer nur EINE Frage, dann warten:\n1. Welcher Anlass, welches Ziel, wie viel Zeit?\n2. Wer sitzt da? Anzahl, Rollen, Stimmung – und was wissen sie schon?\n3. Was soll nach der Rede anders sein? Ein Satz reicht.“\nDer letzte Abschnitt des Prompts lautet: „Beginne mit Frage 1.“"},{"h":"Aus dem Prompt · Schritt 1","t":"„Nenne sechs Anteile für dieses Publikum.“ Anteil = innere Stimme eines Zuhörers."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Bringe die vier Schritte des Gesprächs in die Reihenfolge, in der die KI sie abarbeitet.","first":"Lies die drei Fragen im Material. Suche die Karte zur ersten Frage und schiebe sie nach oben.","hint":"Lies die drei Fragen im Material. Suche die Karte zur ersten Frage und schiebe sie nach oben.","success":"Die Gruppe kann das Gespräch vorhersagen: Anlass, Zuhörer, gewünschte Veränderung, dann erst die Stimmen. Wer die Folge kennt, wird nicht ungeduldig, wenn die KI nach der ersten Antwort wieder fragt.","model":"1. Anlass, Ziel und Zeit. 2. Wer im Raum sitzt. 3. Was danach anders sein soll. 4. Sechs innere Stimmen.","guide":{"why":"Beim Vorführen stockt das Gespräch oft, weil jemand alle Angaben auf einmal schreibt. Die Gruppe lernt, der KI Frage für Frage zu folgen.","pre":["Start: der letzte Abschnitt des Prompts; er löst die erste Frage aus.","Anteil: innere Stimme eines Zuhörers."],"steps":["Lass die Gruppe raten, womit die KI beginnt, bevor ihr das Material lest.","Lest die drei nummerierten Fragen und den Satz zum Start.","Stelle die Stimmen bewusst an die erste Stelle und besprecht die Rückmeldung."],"example":"Am Schalter fragt man erst „Wohin?“, dann „Wann?“, dann „Einfach oder hin und zurück?“ und druckt erst danach die Fahrkarte.","pitfalls":"Die Stimmen sind das Auffälligste am Prompt und rutschen deshalb nach vorn. Ohne Antworten gibt es nichts, woraus sie entstehen.","criteria":"Die drei Fragen stehen in der Nummernfolge des Prompts, die Stimmen danach.","rationale":["Die Fragen sind im Prompt mit 1 bis 3 nummeriert.","„Beginne mit Frage 1“ legt den Anfang fest; Schritt 1 des Ablaufs folgt nach den Fragen."],"goal":""},"trainer":true,"kind":"order","layout":"liste","formName":"Reihenfolge","items":[{"id":"s1","text":"Die KI fragt nach Anlass, Ziel und Zeit.","why":"Der Prompt endet mit „Beginne mit Frage 1“; das ist die Frage nach dem Anlass."},{"id":"s2","text":"Die KI fragt, wer im Raum sitzt.","why":"Wer zuhört, lässt sich erst sinnvoll beschreiben, wenn der Anlass klar ist."},{"id":"s3","text":"Die KI fragt, was nach der Rede anders sein soll.","why":"Die gewünschte Veränderung bezieht sich auf diese Zuhörer; darum kommt die Frage nach ihnen."},{"id":"s4","text":"Die KI nennt sechs innere Stimmen der Entscheider.","why":"Stimmen kann die KI erst ableiten, wenn alle drei Antworten vorliegen."}],"correct":["s1","s2","s3","s4"],"start":["s4","s1","s2","s3"]},{"id":"t06","title":"Welcher Abschnitt hat gefehlt?","kicker":"Aufbau des Prompts","goal":"Zeige an vier Pannen, wozu jeder Abschnitt gebraucht wird.","case":["Ein Kollege von Deniz hat den Prompt gekürzt, „damit er schneller geht“. Viermal fehlte danach ein anderer Abschnitt, und jedes Mal ging etwas anderes schief."],"material":[{"h":"Wozu die vier Abschnitte da sind","t":"WAS DU BRAUCHST: drei Fragen, mit denen die KI Angaben einholt.\nDAS MODELL: eine Tabelle mit Stimmen, die etwas wollen und etwas fürchten.\nABLAUF: vier Schritte von den Stimmen bis zur Reflexion.\nBEISPIEL: ein Muster, das zeigt, wie die Ausgabe aussehen soll."},{"h":"Begriffe einfach erklärt","t":"Abschnitt = ein Teil des Prompts mit eigener Überschrift. Reflexion = der Rückblick der KI auf ihre Rede: Welcher Absatz bedient welche Stimme, und wo ist die Rede angreifbar? Im Material „Der Prompt · wörtlich“ liest du den ganzen Text."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Ordne jede Beobachtung dem Abschnitt zu, der gefehlt hat.","first":"Lies, wozu die vier Abschnitte da sind. Nimm dann die erste Beobachtung und frage: Welche Aufgabe wurde nicht erledigt?","hint":"Lies, wozu die vier Abschnitte da sind. Nimm dann die erste Beobachtung und frage: Welche Aufgabe wurde nicht erledigt?","success":"Die Gruppe sieht: Kein Abschnitt ist überflüssig. Fehlen die Fragen, rät die KI. Fehlt das Modell, bleiben die Zuhörer flach. Fehlt der Ablauf, entfällt die Reflexion. Fehlt das Beispiel, schwankt die Form.","model":"Keine Tabelle: Ablauf. Keine Fragen: Was du brauchst. Schwankender Aufbau: Beispiel. Nur Abteilungen: Das Modell.","guide":{"why":"Prompts werden gern gekürzt. Die Gruppe lernt an Pannen, welchen Preis jede Kürzung hat.","pre":["Abschnitt: ein Teil des Prompts mit eigener Überschrift.","Reflexion: der Rückblick der KI auf ihre Rede."],"steps":["Lass die Gruppe zu jeder Beobachtung sagen, was die KI nicht getan hat.","Sucht gemeinsam den Abschnitt, der genau das verlangt hätte.","Lege die Beobachtung „sofort eine Rede“ bewusst zum Beispiel und besprecht die Rückmeldung."],"example":"Fehlt im Rezept die Zutatenliste, wird geraten. Fehlt das Foto, sieht der Kuchen jedes Mal anders aus.","pitfalls":"Modell und Ablauf werden leicht verwechselt. Das Modell sagt, womit gedacht wird; der Ablauf sagt, in welchen Schritten.","criteria":"Zu jeder Beobachtung kann die Gruppe die fehlende Aufgabe in einem Satz nennen.","rationale":["Jede Panne ist das Ausbleiben genau einer Aufgabe eines Abschnitts.","Die Reflexion steht nur im Ablauf, die Fragen nur in „Was du brauchst“."],"goal":""},"trainer":true,"kind":"place","layout":"spalten","formName":"Felder","targets":[{"id":"f1","label":"Es fehlte: WAS DU BRAUCHST","sub":"","cap":0},{"id":"f2","label":"Es fehlte: DAS MODELL","sub":"","cap":0},{"id":"f3","label":"Es fehlte: ABLAUF","sub":"","cap":0},{"id":"f4","label":"Es fehlte: BEISPIEL","sub":"","cap":0}],"cards":[{"id":"k3","text":"Die KI liefert die Rede, aber keine Tabelle und keine angreifbare Stelle.","target":"f3","why":"Tabelle und angreifbare Stelle sind Schritt 4. Ohne den Ablauf kennt die KI diesen Schritt nicht."},{"id":"k4","text":"Die Ausgabe ist jedes Mal anders aufgebaut; Deniz weiß nie, wie das Ergebnis aussieht.","target":"f4","why":"Das Beispiel zeigt das Zielbild. Ohne Muster baut die KI die Ausgabe jedes Mal neu."},{"id":"k2","text":"Die KI nennt Zuhörer nur nach Abteilungen, ohne Wünsche und Befürchtungen.","target":"f2","why":"„Will“ und „fürchtet“ stehen im Modell. Ohne diese Tabelle fehlt das Denkwerkzeug."},{"id":"k1","text":"Die KI schreibt sofort eine Rede, ohne eine einzige Frage zu stellen.","target":"f1","why":"Die Fragen stehen im Abschnitt „Was du brauchst“. Fehlt er, holt die KI keine Angaben ein."}]},{"id":"t07","title":"Eingehalten oder gebrochen?","kicker":"Regeln des Prompts","goal":"Lass die Gruppe eingehaltene und gebrochene Regeln an echten Stellen unterscheiden.","case":["Deniz zeigt der Gruppe fünf Stellen aus seinen Probeläufen. Bestätigt ist: Das Bodengutachten vom 22.01.2027 verlangt geänderte Fundamente. Die Mehrkosten sind noch nicht beziffert."],"material":[{"h":"Aus dem Prompt · Regeln und Betrieb","t":"Regeln: „Nenne in der Rede weder Anteile noch Antipoden. Keine erfundenen Zahlen. Fehlt etwas: [TBD] und eine Rückfrage. Eine Frage pro Runde. Kein Fragenkatalog.“\nAus dem Abschnitt Betrieb: „Keine erfundenen Fakten: keine Zahlen, Namen, Termine, Zitate, Referenzen, Zusagen oder Ereignisse, die nicht in meinen Angaben stehen. Fehlt etwas, markiere es als [TBD]. Führe die Aufgabe zu Ende; höre nicht auf, um zu fragen, ob du weitermachen sollst. Keine Vorrede, keine Zusammenfassung des Gesprächs, kein Lob.“"},{"h":"Begriffe einfach erklärt","t":"[TBD] steht für „noch zu klären“. Anteile sind innere Stimmen der Zuhörer, zum Beispiel Skeptiker. Mehrkosten = was die Verschiebung zusätzlich kostet."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Ordne jede Stelle zu: eingehalten oder welche Regel gebrochen?","first":"Lies die Regeln im Material. Prüfe dann bei jeder Stelle zuerst: Hält sie die Regel ein oder bricht sie eine?","hint":"Lies die Regeln im Material. Prüfe dann bei jeder Stelle zuerst: Hält sie die Regel ein oder bricht sie eine?","success":"Die Gruppe kann Regeltreue und Regelbruch unterscheiden. [TBD] mit Rückfrage und eine einzelne Frage sind eingehalten. Die 40.000 Euro, die genannten Skeptiker und die Vorrede brechen je eine Regel.","model":"Eingehalten: [TBD] mit Rückfrage; eine Frage, dann warten. Gebrochen: 40.000 Euro (etwas erfunden), „den Skeptikern“ (Stimmen genannt), Lob und Zusammenfassung (Vorrede, Lob, Zusammenfassung).","guide":{"why":"Wer nur nach Fehlern sucht, hält auch richtiges Verhalten für verdächtig. Die Gruppe lernt, beides zu erkennen.","pre":["[TBD]: Platzhalter für „noch zu klären“.","Mehrkosten: was die Verschiebung zusätzlich kostet."],"steps":["Lass die Gruppe jede Stelle zuerst nur mit „eingehalten“ oder „gebrochen“ bewerten.","Sucht bei jedem Bruch den Satz der Regeln, der ihn verbietet.","Lege „[TBD] mit Rückfrage“ bewusst zu „Gebrochen · etwas erfunden“ und besprecht die Rückmeldung."],"example":"Ein Formular mit dem Vermerk „wird nachgereicht“ ist ordentlich ausgefüllt. Ein geschätzter Betrag an derselben Stelle wäre es nicht.","pitfalls":"Das [TBD] sieht aus wie eine Lücke und landet deshalb bei den Brüchen. Es ist die verlangte Kennzeichnung.","criteria":"Beide eingehaltenen Stellen liegen im ersten Feld, und jeder Bruch liegt bei seiner Regel.","rationale":["Die Mehrkosten sind laut Lage nicht beziffert; jede Zahl dazu ist erfunden.","Der Abschnitt „Betrieb“ nennt Vorrede, Zusammenfassung und Lob ausdrücklich."],"goal":""},"trainer":true,"kind":"place","layout":"spalten","formName":"Felder","targets":[{"id":"f1","label":"Eingehalten","sub":"so verlangt es der Prompt","cap":0},{"id":"f2","label":"Gebrochen","sub":"etwas erfunden","cap":0},{"id":"f3","label":"Gebrochen","sub":"Stimmen genannt","cap":0},{"id":"f4","label":"Gebrochen","sub":"Vorrede, Lob, Zusammenfassung","cap":0}],"cards":[{"id":"k4","text":"„Den Skeptikern unter Ihnen lege ich das Gutachten vor.“","target":"f3","why":"Der Skeptiker ist eine Stimme aus dem Modell. In der Rede darf sie nicht genannt werden."},{"id":"k3","text":"„Die Verschiebung kostet rund 40.000 Euro.“ Deniz hat keine Zahl genannt.","target":"f2","why":"Die Mehrkosten sind nicht beziffert. Die Zahl ist erfunden."},{"id":"k2","text":"„Frage 2: Wer sitzt da?“ Danach wartet die KI auf die Antwort.","target":"f1","why":"Eine Frage pro Runde und dann warten: Das ist eingehalten."},{"id":"k1","text":"„Die Mehrkosten: [TBD]. Rückfrage: Bis wann liegt die Zahl vor?“","target":"f1","why":"So verlangt es die Regel: Fehlendes markieren und nachfragen."},{"id":"k5","text":"„Gern! Das ist eine anspruchsvolle Lage. Hier zunächst eine Zusammenfassung unseres Gesprächs.“","target":"f4","why":"Vorrede, Lob und Zusammenfassung verbietet der Abschnitt „Betrieb“."}]},{"id":"t08","title":"Deniz’ Antworten vorbereiten","kicker":"Üben","goal":"Führe vor, wie man die Antworten für den Prompt vorbereitet und Belegtes von Geschätztem trennt.","case":["Führe der Gruppe vor, wie Deniz seine Antworten für den Prompt vorbereitet. Die Mehrkosten kennt er nicht; eine Schätzung eines Kollegen gehört unter „Offen“."],"material":[{"h":"Deniz’ Notizen · bestätigt","t":"Lenkungskreis am Donnerstag, 04.02.2027; Deniz hat zehn Minuten. Er bittet darum, die Abgabe der Ausführungsplanung für die Lagerhalle Süd vom 15.03.2027 auf den 26.04.2027 zu verschieben. Grund: Das Bodengutachten vom 22.01.2027 verlangt geänderte Fundamente. Im Lenkungskreis sitzen sechs Personen: zwei Geschäftsführende, eine Controllerin, zwei Bereichsleiter und eine Vertreterin der Kundin. Die Stimmung ist knapp und genervt; es ist die zweite Verschiebung. Das Gutachten kennen sie noch nicht. In vier von sechs Vorgesprächen kam die Frage: „Woher kommen die sechs Wochen?“"},{"h":"Deniz’ Notizen · nicht bestätigt","t":"Ein Kollege schätzt die Mehrkosten auf „etwa 40.000 Euro“. Eine Berechnung gibt es noch nicht."},{"h":"Die drei Fragen des Prompts","t":"Frage 1: „Welcher Anlass, welches Ziel, wie viel Zeit?“\nFrage 2: „Wer sitzt da? Anzahl, Rollen, Stimmung – und was wissen sie schon?“\nFrage 3: „Was soll nach der Rede anders sein? Ein Satz reicht.“"},{"baustein":"ausprobieren"},{"baustein":"pruefprotokoll"},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Schreibe Deniz’ Antworten für den Prompt und trenne Belegtes von Geschätztem.","first":"Lies zuerst Deniz’ bestätigte Notizen. Trage dann in die Zeile „Bitte:“ ein, worum er den Lenkungskreis bittet.","hint":"Lies zuerst Deniz’ bestätigte Notizen. Trage dann in die Zeile „Bitte:“ ein, worum er den Lenkungskreis bittet.","success":"Die Antworten sind formal vollständig, und du hast die vier Punkte bestätigt. Die Seite bewertet den Inhalt nicht. Zeige der Gruppe jetzt mit einer echten KI, wie sie ihre drei Fragen einzeln stellt und wie Deniz mit diesen Zeilen antwortet. Die Schritte stehen im Material „Mit einer echten KI ausprobieren“.","model":"Bitte: Lenkungskreis am 04.02.2027, zehn Minuten. Deniz bittet, die Abgabe der Ausführungsplanung vom 15.03.2027 auf den 26.04.2027 zu verschieben. Ziel: Zustimmung in dieser Sitzung.\nEntscheider: Sechs Personen: zwei Geschäftsführende, eine Controllerin, zwei Bereichsleiter, eine Vertreterin der Kundin. Stimmung knapp und genervt, weil es die zweite Verschiebung ist. Häufigste Frage: Woher kommen die sechs Wochen?\nDanach: Der Lenkungskreis hält die sechs Wochen für begründet und stimmt zu.\nBeleg: Das Bodengutachten vom 22.01.2027 verlangt geänderte Fundamente.\nOffen: Die Mehrkosten sind nicht berechnet. Die 40.000 Euro sind nur die Schätzung eines Kollegen.","guide":{"why":"Vor Entscheidern wird jede Zahl geprüft. Die Gruppe sieht, wie man der KI Belegtes gibt und Geschätztes ausdrücklich als offen kennzeichnet.","pre":["Beleg: etwas, das die Aussage nachprüfbar macht, hier das Gutachten.","Schätzung: eine Zahl ohne Berechnung."],"steps":["Lass die Gruppe die bestätigten Notizen auf die fünf Zeilen verteilen.","Frage: Wohin gehören die 40.000 Euro, und warum nicht zum Beleg?","Zeige, was die Formhilfe verlangt, bevor du schreibst."],"example":"Im Kostenvoranschlag steht „Material nach Aufmaß“. Das ist ehrlicher als eine Zahl, die nur geraten ist.","pitfalls":"Die 40.000 Euro klingen genau und wandern deshalb in die Zeile „Beleg:“. Dann erscheint die Zahl in der Rede als Tatsache.","criteria":"Die Schätzung steht nur unter „Offen:“; unter „Beleg:“ steht nur das Gutachten.","rationale":["Belegt ist nur das Gutachten vom 22.01.2027.","Der Prompt verlangt [TBD] für fehlende Angaben; das geht nur, wenn die Schätzung als offen übergeben wird."],"goal":""},"trainer":true,"kind":"edit","layout":"freitext","formName":"Freitext","edit":{"fieldLabel":"Deniz’ Antworten für den Prompt","placeholder":"","minLength":240,"required":[{"label":"Bitte","pattern":"^Bitte:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Entscheider","pattern":"^Entscheider:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Danach","pattern":"^Danach:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Beleg","pattern":"^Beleg:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Offen","pattern":"^Offen:[ \\t]*\\S[^\\r\\n]*","flags":"im"}],"starter":"Bitte: \nEntscheider: \nDanach: \nBeleg: \nOffen: ","formatHint":"Beginne jede Zeile mit einer dieser Überschriften und Doppelpunkt: Bitte:, Entscheider:, Danach:, Beleg:, Offen:. Schreibe deinen eigenen Text direkt dahinter. Keine Nummer vor die Überschrift setzen.","prompts":[{"label":"Bitte","question":"Worum bittet Deniz, bei welchem Anlass und in welcher Zeit?"},{"label":"Entscheider","question":"Wer sitzt im Lenkungskreis, in welcher Stimmung, und was fragen sie?"},{"label":"Danach","question":"Welcher eine Satz soll nach den zehn Minuten gelten?"},{"label":"Beleg","question":"Womit begründet Deniz die sechs Wochen?"},{"label":"Offen","question":"Welche Zahl ist nur geschätzt?"}],"checks":["Unter „Bitte:“ stehen beide Termine und die zehn Minuten.","Unter „Entscheider:“ stehen die sechs Rollen und die häufigste Frage aus den Vorgesprächen.","Unter „Beleg:“ steht das Bodengutachten mit Datum.","Die 40.000 Euro stehen nur unter „Offen:“ und sind als Schätzung gekennzeichnet."]}},{"id":"t09","title":"Welcher Anfang hält den Prompt ein?","kicker":"Ausgabe prüfen","goal":"Zeige, dass eine Ausgabe an den Regeln gemessen wird, nicht am Geschmack.","case":["Deniz hat drei Anfänge für seine zehn Minuten bekommen. Bestätigt sind die Bitte um sechs Wochen, die beiden Termine und das Bodengutachten vom 22. Januar. Die Mehrkosten sind nicht beziffert."],"material":[{"h":"Aus dem Prompt · Regeln","t":"„Keine erfundenen Zahlen. Fehlt etwas: [TBD] und eine Rückfrage.“ Zur Rede heißt es: „Kein Pathos, keine Floskeln, keine Aufzählung von Argumenten.“"},{"h":"Begriffe einfach erklärt","t":"[TBD] steht für „noch zu klären“. Pathos = übertrieben feierlicher Ton. Floskel = ein abgenutzter Satz, der nichts Bestimmtes sagt."},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Wähle den Anfang, der den Prompt einhält, und markiere genau zwei echte Mängel der anderen.","first":"Lies die Regeln im Material. Prüfe jeden Anfang Satz für Satz gegen die bestätigten Angaben in der Lage.","hint":"Lies die Regeln im Material. Prüfe jeden Anfang Satz für Satz gegen die bestätigten Angaben in der Lage.","success":"Die Gruppe misst an den Regeln: Anfang C nennt nur Bestätigtes und kennzeichnet die Kosten mit [TBD]. Anfang A ist Pathos, Anfang B erfindet eine Zahl. Dass C mit der Bitte beginnt, ist kein Mangel.","model":"Anfang C. Echte Mängel der anderen: A besteht aus Pathos und Floskeln, B nennt eine unbelegte Zahl.","guide":{"why":"Gruppen streiten über Ausgaben gern nach Gefallen. Hier lernen sie, zuerst die Regeln des Prompts als Maßstab anzulegen.","pre":["Pathos: übertrieben feierlicher Ton.","Floskel: ein abgenutzter Satz, der nichts Bestimmtes sagt."],"steps":["Frage die Gruppe zuerst, welcher Anfang ihr gefällt, und notiere die Stimmen.","Legt dann die Regeln daneben und prüft jeden Satz gegen die bestätigten Angaben.","Markiere bewusst „C: lässt die Kosten offen“ als Mangel und besprecht die Rückmeldung."],"example":"Beim Diktat zählt nicht, welche Handschrift schöner ist. Es zählt, welche Fassung die wenigsten Fehler hat.","pitfalls":"Anfang B wirkt entschlossen, weil er eine Zahl nennt. Die Zahl ist geschätzt und würde im Lenkungskreis sofort hinterfragt.","criteria":"Der gewählte Anfang enthält keine Zahl ohne Beleg und keine Floskel.","rationale":["Alle Angaben in Anfang C stehen in der Lage als bestätigt.","Die Mehrkosten sind nicht beziffert; darum ist [TBD] richtig und die 40.000 Euro falsch."],"goal":""},"trainer":true,"kind":"compare","layout":"vergleich","formName":"Vergleich","drafts":[{"id":"d1","label":"Anfang A","text":"„Gemeinsam werden wir auch diese Herausforderung meistern, denn in jeder Krise liegt eine Chance. Lassen Sie mich zunächst die Geschichte des Projekts erzählen.“","why":"Anfang A besteht aus Pathos und Floskeln. Beides verbietet der Prompt.","best":false,"img":""},{"id":"d2","label":"Anfang B","text":"„Ich bitte Sie heute um sechs Wochen: Abgabe am 26. April statt am 15. März. Die Verschiebung kostet rund 40.000 Euro; das ist verkraftbar.“","why":"Anfang B nennt Mehrkosten, die niemand berechnet hat.","best":false,"img":""},{"id":"d3","label":"Anfang C","text":"„Ich bitte Sie heute um sechs Wochen: Abgabe am 26. April statt am 15. März. Der Grund ist das Bodengutachten vom 22. Januar; es verlangt geänderte Fundamente. Was das kostet: [TBD].“","why":"","best":true,"img":""}],"best":"d3","flaws":[{"id":"m1","label":"C: beginnt mit der Bitte","text":"Die Rede nennt gleich im ersten Satz, worum es geht.","ok":false,"why":"Das ist kein Mangel. Der Prompt schreibt keinen Einstieg vor, und Entscheider mit wenig Zeit wollen den Punkt."},{"id":"m2","label":"A: Pathos und Floskeln","text":"„In jeder Krise liegt eine Chance“ sagt nichts über Termin oder Grund.","ok":true,"why":"Der Prompt verlangt: kein Pathos, keine Floskeln."},{"id":"m3","label":"C: lässt die Kosten offen","text":"Die Rede nennt keine Zahl zu den Mehrkosten und setzt [TBD].","ok":false,"why":"Das ist kein Mangel. Die Mehrkosten sind nicht beziffert; [TBD] ist die verlangte Kennzeichnung."},{"id":"m4","label":"B: unbelegte Zahl","text":"„Rund 40.000 Euro“ steht in keiner bestätigten Angabe.","ok":true,"why":"Der Prompt verbietet erfundene Zahlen."}]},{"id":"t10","title":"Ein Fall aus der Gruppe","kicker":"Eigener Fall","goal":"Bereite mit der Gruppe den Prompt für einen Anlass aus der Runde vor.","case":["Bitte die Gruppe um einen Anlass, bei dem jemand aus der Runde bald vor Menschen spricht. Schreibt gemeinsam die Eingaben für den Prompt und legt fest, woran ihr die Ausgabe messt. Keine echten Namen, nichts Vertrauliches."],"material":[{"h":"Das Raster für die Gruppe","t":"Anlass: wo gesprochen wird, wie lange und mit welchem Ziel.\nZuhörer: wer zuhört, in welcher Stimmung, mit welchem Vorwissen.\nDanach: ein Satz, der nach der Ansprache gelten soll.\nRegelprüfung: an welchen Regeln des Prompts die Gruppe die Ausgabe misst.\nOffen: was niemand in der Runde weiß."},{"h":"Die Regeln des Prompts als Prüfliste","t":"Die Rede nennt keine Anteile und keine Antipoden. Jeder Satz geht auf die Angaben der Gruppe zurück: keine erfundenen Zahlen, Namen, Termine oder Zusagen; Fehlendes ist mit [TBD] markiert. Kein Pathos, keine Floskeln, keine Aufzählung von Argumenten. [TBD] steht für „noch zu klären“."},{"baustein":"ausprobieren"},{"baustein":"pruefprotokoll"},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Schreibe mit der Gruppe Eingaben und Prüfplan für einen Anlass aus der Runde.","first":"Frage die Gruppe nach einem Anlass und trage ihn in die Zeile „Anlass:“ ein.","hint":"Frage die Gruppe nach einem Anlass und trage ihn in die Zeile „Anlass:“ ein.","success":"Der Fall der Gruppe ist formal vollständig, und ihr habt die vier Punkte bestätigt. Die Seite bewertet den Inhalt nicht. Führt den Prompt jetzt gemeinsam mit einer echten KI aus und messt die Ausgabe an eurer Regelprüfung. Die Schritte stehen im Material „Mit einer echten KI ausprobieren“.","model":"Anlass: Betriebsversammlung eines Handwerksbetriebs, sechs Minuten. Ziel: Die neue Zeiterfassung per App wird ab dem nächsten Monat genutzt.\nZuhörer: 25 Beschäftigte, viele seit Jahren im Betrieb. Stimmung misstrauisch, weil die App als Kontrolle verstanden wird. Sie wissen, dass etwas Neues kommt, kennen die App aber nicht.\nDanach: Alle wissen, wozu die Zeiten gebraucht werden, und melden sich in der App an.\nRegelprüfung: Die Rede nennt keine Stimmen beim Namen. Sie enthält keine erfundenen Zahlen und keine Floskeln.\nOffen: Ob Pausen automatisch abgezogen werden, hat die Geschäftsführung noch nicht entschieden.","guide":{"why":"Ein Fall aus der eigenen Runde zeigt der Gruppe, dass der Prompt für ihre Arbeit taugt. Das gemeinsame Schreiben macht sichtbar, wie wenig man oft über Zuhörer weiß.","pre":["Regelprüfung: die Regeln, an denen die Ausgabe gemessen wird.","[TBD]: Platzhalter für „noch zu klären“."],"steps":["Sammle zwei oder drei Anlässe und lass die Gruppe einen wählen.","Frage bei „Zuhörer:“ so lange nach, bis Stimmung und Vorwissen genannt sind.","Lass die Gruppe selbst entscheiden, welche zwei Regeln sie prüfen will, und notiere unter „Offen:“ eine echte Lücke."],"example":"Vor einer Wanderung fragt die Gruppe: Wohin, mit wem, was soll am Abend erreicht sein, und was wissen wir über das Wetter nicht?","pitfalls":"Gruppen füllen „Offen:“ ungern aus, weil Nichtwissen als Schwäche gilt. Gerade diese Zeile verhindert erfundene Angaben.","criteria":"Jemand außerhalb der Runde könnte den Prompt mit diesen fünf Zeilen ausführen.","rationale":["Die ersten drei Zeilen entsprechen den drei Fragen des Prompts.","Regelprüfung und Offenes stammen aus den Regeln: Ausgabe messen, nichts erfinden lassen."],"goal":""},"trainer":true,"kind":"edit","layout":"freitext","formName":"Freitext","edit":{"fieldLabel":"Der Fall der Gruppe","placeholder":"","minLength":240,"required":[{"label":"Anlass","pattern":"^Anlass:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Zuhörer","pattern":"^Zuhörer:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Danach","pattern":"^Danach:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Regelprüfung","pattern":"^Regelprüfung:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Offen","pattern":"^Offen:[ \\t]*\\S[^\\r\\n]*","flags":"im"}],"starter":"Anlass: \nZuhörer: \nDanach: \nRegelprüfung: \nOffen: ","formatHint":"Beginne jede Zeile mit einer dieser Überschriften und Doppelpunkt: Anlass:, Zuhörer:, Danach:, Regelprüfung:, Offen:. Schreibe deinen eigenen Text direkt dahinter. Keine Nummer vor die Überschrift setzen.","prompts":[{"label":"Anlass","question":"Welchen Anlass nennt die Gruppe, mit welcher Zeit und welchem Ziel?"},{"label":"Zuhörer","question":"Was weiß die Gruppe über Stimmung und Vorwissen der Zuhörer?"},{"label":"Danach","question":"Auf welchen einen Satz einigt sich die Gruppe?"},{"label":"Regelprüfung","question":"Welche zwei Regeln prüft die Gruppe an der Ausgabe?"},{"label":"Offen","question":"Welche Angabe kennt niemand in der Runde?"}],"checks":["Der Anlass stammt aus der Gruppe und enthält keine echten Namen.","Unter „Zuhörer:“ hat die Gruppe Stimmung und Vorwissen benannt, nicht nur Rollen.","Unter „Regelprüfung:“ stehen mindestens zwei Regeln des Prompts.","Unter „Offen:“ steht eine Angabe, die niemand in der Runde weiß."]}},{"id":"t11","title":"Rückblick mit der Gruppe","kicker":"Rückblick","goal":"Sammle mit der Gruppe, wie der Lauf gelungen ist und wo der Prompt in ihrer Arbeit passt.","case":["Die Gruppe hat den Prompt gemeinsam oder in Paaren ausgeführt. Sammle jetzt Rückmeldungen und schreibe sie mit. Nimm auch Widerspruch auf: Nicht jede Person kommt mit dem Prompt gleich gut zurecht."],"material":[{"h":"Sechs Fragen an die Gruppe","t":"Gelungen: Was hat beim Ausführen gut funktioniert?\nGehakt: Wo hat die KI eine Regel nicht eingehalten, oder wo kam die Gruppe nicht weiter?\nDesign: Welcher Gedanke des Prompts hat geholfen, zum Beispiel erst das Publikum zu klären?\nAufbau: Welcher Abschnitt hat am meisten bewirkt, welcher blieb unklar?\nEinsatz: Für welche Anlässe in der Arbeit der Gruppe passt der Prompt?\nKein Einsatz: Wofür passt er nicht, und warum?"},{"h":"Zur Erinnerung · Design und Aufbau","t":"Design meint, wie der Prompt gedacht ist: erst das Publikum, dann der Text; innere Stimmen; nichts erfinden. Aufbau meint, wie er gebaut ist: neun Abschnitte von ROLLE bis START. Der Prompt ist für kurze, gesprochene Ansprachen vor mehreren Zuhörern gebaut."},{"baustein":"pruefprotokoll"},{"baustein":"ausprobieren"},{"baustein":"prompt"},{"baustein":"lesehilfe"}],"question":"Schreibe die Rückmeldungen der Gruppe in sechs Zeilen mit.","first":"Frage die Gruppe zuerst, was gelungen ist, und trage es in die Zeile „Gelungen:“ ein.","hint":"Frage die Gruppe zuerst, was gelungen ist, und trage es in die Zeile „Gelungen:“ ein.","success":"Der Rückblick der Gruppe ist formal vollständig, und ihr habt die vier Punkte bestätigt. Die Seite bewertet den Inhalt nicht. Mit „Abschluss kopieren“ nimmst du die Rückmeldungen für die Auswertung des Kurses mit.","model":"Gelungen: Die KI hat einzeln gefragt, und die sechs Stimmen passten zu unserem Publikum.\nGehakt: In der Rede stand eine Zusage, die niemand gemacht hatte; wir mussten sie streichen lassen.\nDesign: Hilfreich war, zuerst über die Zuhörer zu sprechen. Zwei Personen fanden das Bild der Stimmen zu schematisch.\nAufbau: Am meisten bewirkt haben die drei Fragen in WAS DU BRAUCHST und die Regel mit [TBD]. Der Abschnitt DAS MODELL war einigen zu dicht.\nEinsatz: Ansprache zur neuen Schichtregel, Eröffnung der Jahresschulung.\nKein Einsatz: Aushang am Schwarzen Brett und Einzelgespräche, weil dort niemand als Gruppe zuhört.","guide":{"why":"Die Rückmeldungen der Gruppe zeigen dir, ob der Prompt für ihre Arbeit taugt und was du beim nächsten Mal anders vorführst. Die Gruppe hört dabei, dass andere ähnlich oder anders zurechtkamen.","pre":["Design: wie der Prompt gedacht ist.","Aufbau: wie der Prompt gebaut ist, also seine Abschnitte."],"steps":["Frage zuerst nach Gelungenem, dann nach dem, was gehakt hat; schreibe wörtlich mit.","Frage getrennt nach Design und Aufbau und lass zu jedem Punkt eine Stelle im Prompt nennen.","Sammle zum Schluss je zwei Anlässe: einen, für den die Gruppe den Prompt nimmt, und einen, für den nicht."],"example":"Nach einem gemeinsamen Probekochen fragt man: Was hat geschmeckt, was ging schief, lag es am Rezept oder an der Reihenfolge, und für welchen Anlass kochen wir es wieder?","pitfalls":"Wer vorführt, verteidigt den Prompt leicht gegen Kritik. Die Zeilen „Gehakt:“ und „Kein Einsatz:“ sind genauso wichtig wie die anderen.","criteria":"In jeder Zeile steht eine Aussage der Gruppe, nicht deine eigene Einschätzung.","rationale":["Gelungenes und Gehaktes beschreiben die Durchführung, Design und Aufbau erklären sie.","Einsatz und Nicht-Einsatz machen aus dem Lauf eine Entscheidung für die Arbeit der Gruppe."],"goal":""},"trainer":true,"kind":"edit","layout":"freitext","formName":"Freitext","edit":{"fieldLabel":"Rückblick der Gruppe","placeholder":"","minLength":260,"required":[{"label":"Gelungen","pattern":"^Gelungen:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Gehakt","pattern":"^Gehakt:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Design","pattern":"^Design:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Aufbau","pattern":"^Aufbau:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Einsatz","pattern":"^Einsatz:[ \\t]*\\S[^\\r\\n]*","flags":"im"},{"label":"Kein Einsatz","pattern":"^Kein Einsatz:[ \\t]*\\S[^\\r\\n]*","flags":"im"}],"starter":"Gelungen: \nGehakt: \nDesign: \nAufbau: \nEinsatz: \nKein Einsatz: ","formatHint":"Beginne jede Zeile mit einer dieser Überschriften und Doppelpunkt: Gelungen:, Gehakt:, Design:, Aufbau:, Einsatz:, Kein Einsatz:. Schreibe deinen eigenen Text direkt dahinter. Keine Nummer vor die Überschrift setzen.","prompts":[{"label":"Gelungen","question":"Was nennt die Gruppe als gelungen?"},{"label":"Gehakt","question":"Wo ist die Gruppe hängen geblieben?"},{"label":"Design","question":"Welchen Gedanken des Prompts nennt die Gruppe hilfreich?"},{"label":"Aufbau","question":"Welchen Abschnitt nennt die Gruppe beim Namen?"},{"label":"Einsatz","question":"Welche Anlässe aus ihrer Arbeit nennt die Gruppe?"},{"label":"Kein Einsatz","question":"Wofür würde die Gruppe den Prompt nicht nehmen?"}],"checks":["Unter „Gelungen:“ und „Gehakt:“ steht je eine Beobachtung aus dem Lauf der Gruppe.","Unter „Design:“ steht ein Gedanke des Prompts, den die Gruppe selbst genannt hat.","Unter „Aufbau:“ ist mindestens ein Abschnitt beim Namen genannt.","Unter „Einsatz:“ und „Kein Einsatz:“ steht je ein Anlass aus der Arbeit der Gruppe, ohne echte Namen."]}}],"logo":"data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4gPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGlkPSJFYmVuZV8xIiBkYXRhLW5hbWU9IkViZW5lIDEiIHZpZXdCb3g9IjAgMCA1ODEuMDIgMjQ0LjQ3Ij48ZGVmcz48c3R5bGU+IC5jbHMtMSwgLmNscy0yIHsgZmlsbDogIzAxMDEwMTsgfSAuY2xzLTMsIC5jbHMtMiwgLmNscy00IHsgZmlsbC1ydWxlOiBldmVub2RkOyB9IC5jbHMtMywgLmNscy01IHsgZmlsbDogI2ZmMWExYTsgfSAuY2xzLTQgeyBmaWxsOiAjNzY3ZDhjOyB9IDwvc3R5bGU+PC9kZWZzPjxwYXRoIGNsYXNzPSJjbHMtNSIgZD0iTTU1Ny45OSwxNjMuMTdoMjMuMDN2Ny44NmgtMzIuNzZ2LTQyLjMxaDMxLjk4djcuODZoLTIyLjI0djI2LjU5aC0uMDFaTTU1Ny4yNiwxNDUuNzZoMjAuMzd2Ny42MmgtMjAuMzd2LTcuNjJaTTUyNC4yLDE3MS43NWMtMy4yNywwLTYuMy0uNTMtOS4xLTEuNnMtNS4yMy0yLjU5LTcuMjgtNC41NmMtMi4wNi0xLjk3LTMuNjYtNC4yOS00LjgxLTYuOT
